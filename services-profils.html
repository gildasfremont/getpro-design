<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GetPro Métiers</title>
<meta name="description" content="+2000 talents recrutés sur Tech, Product, Data, Sales, Marketing, Ops et C-level. La cartographie des profils que GetPro chasse au quotidien." />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<meta property="og:title" content="GetPro Métiers" />
<meta property="og:description" content="+2000 talents recrutés sur Tech, Product, Data, Sales, Marketing, Ops et C-level. La cartographie des profils que GetPro chasse au quotidien." />
<meta property="og:type" content="website" />
<meta property="og:locale" content="fr_FR" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="styles.css?v=1" />
<style>
  .solutions {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding-bottom: var(--gap-section);
  }
  /* .solutions-head + .solutions-title-row : règles globales dans
     styles.css (cf. services-tech.html / services-renfort.html). */

  /* Col 2 du panel-body : view-tabs (Postes / Retour d'expérience) en
     haut, et le contenu de la vue active en dessous. Le filtrage par
     catégorie (col 1) s'applique aux deux vues. */
  .content-col {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .view-tabs {
    /* Sticky en haut du content-col pendant le scroll. align-self: stretch
       pour que le fond blanc couvre toute la largeur du content-col.
       Box-shadow vertical + isolation pour empêcher le contenu de bleed
       au-dessus ou en dessous lors du scroll. */
    display: flex;
    align-self: stretch;
    gap: clamp(20px, 3vw, 50px);
    margin-bottom: clamp(28px, 3.4vw, 50px);
    position: -webkit-sticky;
    position: sticky;
    top: clamp(44px, 6.7vw, 96px);
    background: var(--bg);
    /* padding-block-start généreux : crée une bande blanche au-dessus du
       texte des tabs pour respirer quand le sticky vient se coller juste
       sous la nav. End 0 : la border-bottom touche pile la baseline. */
    padding-block: clamp(24px, 2.8vw, 40px) 0;
    border-bottom: 1px solid var(--line);
    /* Box-shadow vers le haut pour masquer le contenu qui pourrait
       passer à travers la zone sous le header. */
    box-shadow: 0 -20px 0 0 var(--bg);
    z-index: 10;
  }
  .view-tab {
    /* Pas de padding-top : Placements aligne sa baseline sur "Tech" dans
       la col 1. Padding-bottom pour respirer entre le texte et le trait. */
    padding: 0 0 clamp(10px, 1.2vw, 16px);
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.25;
    background: none;
    color: inherit;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    /* La border-bottom du tab couvre 1px du hairline parent + ajoute 1px
       sous (total 2px d'épaisseur visible) à l'aplomb du tab actif. */
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .view-tab[aria-current="true"] {
    border-bottom-color: var(--ink);
  }
  .view-body[hidden] { display: none; }

  /* Vue "Postes" : 2 cols categories | profils.
     align-items: baseline → la baseline du 1er texte de chaque col
     s'aligne (Tech ↔ Postes alignés sur le bas du texte, pas sur
     le haut du box). */
  /* Panel-body : 1 colonne sur tous les viewports. La nav par catégories
     devient une bande horizontale sticky en haut du content (pattern
     identique mobile/desktop). */
  .panel-body {
    display: flex;
    flex-direction: column;
  }
  /* Categories : retirées. Tous les témoignages s'affichent en mur
     continu dans le panel blanc. */
  .categories-col { display: none; }
  .categories-bar {
    display: flex;
    align-items: flex-end;
    gap: clamp(4px, 0.4vw, 8px);
    padding: clamp(12px, 1.6vw, 18px) var(--pad-x) 0;
    min-width: 0;
  }
  .categories-col #bucket-tabs {
    flex: 1 1 auto;
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    align-items: flex-end;
    gap: clamp(20px, 2.5vw, 36px);
    overflow: hidden;
    min-width: 0;
  }
  /* Tabs en texte simple : actif souligné par une stroke épaisse juste
     en dessous, inactifs en gris léger. Pas de bordure, pas de fond. */
  .categories-col #bucket-tabs .subtab {
    padding: clamp(8px, 0.8vw, 12px) 0;
    font-size: clamp(15px, 1.5vw, 19px);
    line-height: 1.25;
    cursor: pointer;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    color: inherit;
    opacity: 0.55;
    font-family: inherit;
    white-space: nowrap;
    flex-shrink: 0;
    margin-bottom: -1px;
    transition: opacity 0.15s ease, border-color 0.15s ease;
  }
  .categories-col #bucket-tabs .subtab:hover {
    opacity: 1;
  }
  .categories-col #bucket-tabs .subtab[aria-current="true"] {
    opacity: 1;
    border-bottom-color: var(--ink);
  }
  #bucket-tabs .subtab[aria-current="true"]::after { display: none; }
  /* White panel : contient les testimonials, posé sous les tabs. */
  .content-col {
    min-width: 0;
    background: var(--white);
    padding: clamp(28px, 3.5vw, 56px) clamp(24px, 3vw, 48px);
    border-radius: clamp(8px, 1vw, 12px);
  }
  /* Filtres de sous-catégorie texte plain en row, underline sur
     l'actif. Même langage typographique que le reste du site
     (.subtab, .foot-featured, etc) : pas de pill / pas de bg fill. */
  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(20px, 2.5vw, 40px);
    margin-bottom: clamp(24px, 2.8vw, 40px);
  }
  .filter-chips[hidden] { display: none; }
  /* Cartouches : même langage que les subtabs CDI/Freelance/C-Level
     sur les pages Chasse/Renfort. Inactif = bg léger, actif = white +
     border ink. */
  .filter-chip {
    padding: clamp(10px, 1vw, 14px) clamp(16px, 1.6vw, 22px);
    font-size: clamp(16px, 1.5vw, 20px);
    line-height: 1.25;
    background: var(--bg);
    border: 1px solid transparent;
    border-radius: clamp(6px, 0.5vw, 8px);
    color: inherit;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .filter-chip:hover {
    background: #ececea;
  }
  .filter-chip[aria-current="true"] {
    background: var(--white);
    border-color: var(--ink);
  }
  .filter-chips {
    gap: clamp(6px, 0.7vw, 12px);
  }

  /* Profiles : single column flat list, même taille que la liste
     des noms sur la page Clients. Toutes les catégories sont rendues
     en même temps les subtabs (col 1) et les chips (par section)
     servent uniquement à scroller jusqu'à la bonne ancre. */
  .profiles-area {
    font-size: clamp(17px, 1.7vw, 22px);
    line-height: 1.25;
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 3vw, 44px);
  }
  /* Mur de témoignages Swiss design : multi-colonnes via CSS columns,
     les .company-block ne sont pas coupés entre colonnes (break-inside:
     avoid). Les colonnes ont une largeur min, le nombre s'adapte
     automatiquement à la largeur du panel. */
  .bucket-section {
    column-width: clamp(240px, 22vw, 320px);
    column-gap: clamp(28px, 3vw, 56px);
  }
  .bucket-section-title {
    font-size: clamp(22px, 2.6vw, 36px);
    line-height: 1.2;
    margin: 0;
  }
  .profiles-block {
    display: flex;
    flex-direction: column;
    gap: clamp(2px, 0.3vw, 6px);
    /* Même offset que les sections elles-mêmes pour les chips qui
       pointent vers un sous-bloc précis. */
    scroll-margin-top: 110px;
  }
  .profiles-sub-title {
    font-size: clamp(16px, 1.5vw, 20px);
    line-height: 1.25;
    opacity: 0.6;
    margin: 0 0 clamp(8px, 1vw, 12px);
    /* Léger letter-spacing, look "label" comme les sub-titles éditoriaux. */
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .profile {
    color: inherit;
    display: block;
    padding: clamp(3px, 0.4vw, 5px) 0;
  }

  .empty-state {
    padding: 40px 0;
    color: var(--ink);
    opacity: 0.6;
    font-size: var(--fs-body);
  }

  /* Témoignages groupés par boîte. Chaque .company-block est un grid
     2 cols : logo (sticky) à gauche, liste des témoignages à droite.
     Quand l'utilisateur scrolle dans les témoignages d'une boîte, le
     logo reste visible il libère la place quand on arrive au
     groupe suivant. Reprend le pattern visuel de la liste Clients
     (logo + texte côté). */
  .testimonials {
    display: flex;
    flex-direction: column;
    gap: clamp(40px, 4vw, 64px);
  }
  .company-block {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 1.2vw, 18px);
    /* Ne pas couper un company-block au milieu d'une colonne. */
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
    /* Espacement vertical entre blocs (le gap des flex ne s'applique
       pas dans un parent column-based). */
    margin-bottom: clamp(40px, 4vw, 64px);
  }
  .company-logo-cell {
    align-self: flex-start;
  }
  .company-logo-cell img {
    width: clamp(80px, 9vw, 130px);
    height: auto;
    max-height: clamp(28px, 2.8vw, 40px);
    object-fit: contain;
    object-position: left center;
    display: block;
  }
  .company-name-fallback {
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.25;
    opacity: 0.6;
  }
  .company-testimonials {
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 3vw, 44px);
  }
  .testimonial-card {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.2vw, 18px);
  }
  .testimonial-quote {
    font-size: clamp(14px, 1.25vw, 17px);
    line-height: 1.45;
    margin: 0;
  }
  .testimonial-author {
    display: flex;
    flex-direction: column;
    font-size: clamp(13px, 1.1vw, 15px);
    line-height: 1.3;
  }

  @media (max-width: 700px) {
    .company-block {
      grid-template-columns: 1fr;
      gap: clamp(16px, 2vw, 24px);
    }
    .company-logo-cell {
      position: static;
    }
    /* En mobile, pas de décalage : tout s'aligne à gauche. */
    .company-testimonials {
      margin-left: 0;
    }
  }

  /* Trigger desktop : caché (legacy, l'élément peut encore exister
     dans le HTML). */
  .categories-trigger { display: none; }

  .content-col { padding-top: clamp(28px, 3.4vw, 48px); }
  /* Chevron "plus" à droite : visible uniquement si JS a détecté
     de l'overflow et a peuplé .categories-overflow. */
  .categories-more {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    background: none;
    border: none;
    cursor: pointer;
    color: inherit;
  }
  .categories-more[hidden] { display: none; }
  .categories-more .chevron { transition: transform 0.18s ease; }
  .categories-more[aria-expanded="true"] .chevron { transform: rotate(180deg); }
  /* Dropdown des items overflow : positionné juste sous la barre
     categories. Le contenu en dessous est blur via body.cats-open. */
  .categories-overflow {
    list-style: none;
    margin: 0;
    padding: clamp(16px, 2.4vw, 28px) var(--pad-x) clamp(28px, 3.4vw, 40px);
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--bg);
    z-index: 29;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(14px, 1.8vw, 22px);
  }
  .categories-overflow[hidden] { display: none; }
  .categories-overflow .subtab {
    font-size: clamp(17px, 1.7vw, 22px);
    padding: 0;
    text-align: left;
    background: none;
    border: none;
    color: inherit;
    font-family: inherit;
    cursor: pointer;
  }
  .categories-overflow .subtab[aria-current="true"] {
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  /* Rating Trustpilot caché : prend de la place pour rien dans la barre. */
  .categories-col .rating { display: none; }
  /* Blur du contenu derrière (testimonials) quand le dropdown est ouvert.
     Hors @media pour pouvoir cibler aussi le scrim global. */
  body.cats-open .content-col {
    filter: blur(8px);
    pointer-events: none;
    user-select: none;
  }
  .content-col { transition: filter 0.2s ease; }
  /* Scroll-margin pour que les sections atterrissent sous les bars sticky
     (header + subtabs + categories) avec de la respiration en plus. */
  .bucket-section {
    scroll-margin-top: calc(var(--header-h, 60px) + var(--subtabs-h, 50px) + var(--cats-h, 56px) + clamp(48px, 5vw, 80px));
  }
</style>
</head>
<body>
  <main class="home">

    <header class="header section" data-nav></header>

    <section class="solutions section"><h1 class="page-lede">Recrutements de dirigeants en CDI et Freelance. Une practice par fonction.</h1>
<div class="panel" id="practices" style="scroll-margin-top: var(--header-h, 60px);">

        <div class="subtabs-row">
          <nav class="subtabs" aria-label="Practices">
            <a class="subtab" href="services-tech.html#practices">Tech, IA &amp; Data</a>
            <a class="subtab" href="services-produit.html#practices">Product &amp; Projects</a>
            <a class="subtab" href="services-sales.html#practices">Customer &amp; Admin</a>
            <a class="subtab subtab--accent" href="services-profils.html#practices" aria-current="page">+2000 recrutements</a>
          </nav>
        </div>

        <div class="panel-body">
          <div class="categories-col">
            <div class="categories-bar">
              <div class="subtabs" role="tablist" id="bucket-tabs">
                <button class="subtab" role="tab" data-bucket="tech" aria-current="true">Tech</button>
                <button class="subtab" role="tab" data-bucket="product">Product</button>
                <button class="subtab" role="tab" data-bucket="data">Data</button>
                <button class="subtab" role="tab" data-bucket="sales">Sales &amp; Customer</button>
                <button class="subtab" role="tab" data-bucket="marketing">Marketing</button>
                <button class="subtab" role="tab" data-bucket="ops">Ops. &amp; Admin</button>
                <button class="subtab" role="tab" data-bucket="hr">HR</button>
              </div>
              <button class="categories-more" type="button" aria-expanded="false" aria-controls="categories-overflow" aria-label="Plus de catégories" hidden>
                <svg class="chevron" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                  <path d="M3.5 5.75L8 10.25l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <ul class="categories-overflow" id="categories-overflow" hidden></ul>
            <div class="rating">
              <img src="assets/trustpilot.svg" alt="Trustpilot" class="rating-logo" />
              <span class="rating-stars">5 ★★★★★</span>
            </div>
          </div>

          <div class="content-col">
            <div class="testimonials" id="candidate-testimonials"></div>
          </div>
        </div>
        <a href="clients.html" class="btn-outline">Tous nos clients →</a>
      </div>

    </section>

    <footer class="site-footer" data-footer></footer>

  </main>
  <script src="partials.js?v=1" defer></script>
  <script>
    (function() {
      const tabsHost = document.getElementById('bucket-tabs');
      const container = document.getElementById('candidate-testimonials');
      const escape = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

      let candidates = [];
      let activeBucket = tabsHost.querySelector('.subtab[aria-current="true"]')?.dataset.bucket || 'tech';

      function scrollToActiveBucket() {
        const target = container.querySelector(`.bucket-section[data-bucket="${activeBucket}"]`);
        if (target) target.scrollIntoView({ behavior: 'auto', block: 'start' });
      }

      function bucketOrder() {
        return Array.from(tabsHost.querySelectorAll('.subtab[data-bucket]'))
          .map(b => ({ key: b.dataset.bucket, label: b.textContent.trim() }));
      }

      function renderTestimonials() {
        const html = bucketOrder().map(({ key, label }) => {
          const list = candidates.filter(c => c.bucket === key);
          if (list.length === 0) return '';
          const groups = new Map();
          for (const c of list) {
            const k = c.company_slug;
            if (!groups.has(k)) groups.set(k, { meta: c, items: [] });
            groups.get(k).items.push(c);
          }
          const blocks = Array.from(groups.values()).map(({ meta, items }) => {
            const logoOrName = meta.has_logo
              ? `<img src="assets/${meta.company_slug}.svg" alt="${escape(meta.company_name)}" />`
              : `<span class="company-name-fallback">${escape(meta.company_name)}</span>`;
            const cards = items.map(c => {
              const role = c.poste_canonique || c.intitule_original || 'Recruté';
              return `<article class="testimonial-card">
                <p class="testimonial-quote">"${escape(c.text)}"</p>
                <div class="testimonial-author">
                  <div class="name">${escape(c.consumer_name)}</div>
                  <div class="role">${escape(role)}</div>
                </div>
              </article>`;
            }).join('');
            return `<div class="company-block">
              <div class="company-logo-cell">${logoOrName}</div>
              <div class="company-testimonials">${cards}</div>
            </div>`;
          }).join('');
          return `<section class="bucket-section" id="bucket-${escape(key)}" data-bucket="${escape(key)}">
            ${blocks}
          </section>`;
        }).join('');
        container.innerHTML = html || `<div class="empty-state">Aucun témoignage candidat pour le moment.</div>`;
      }

      // Pattern priority+ : sur mobile (<=800px), les items qui ne tiennent
      // pas dans la .categories-bar sont déplacés dans .categories-overflow,
      // accessible via le bouton chevron .categories-more.
      const bar = document.querySelector('.categories-bar');
      const moreBtn = document.querySelector('.categories-more');
      const overflowList = document.getElementById('categories-overflow');
      const isMobile = () => window.matchMedia('(max-width: 800px)').matches;

      const restoreAll = () => {
        // Remet tous les items dans tabsHost dans leur ordre data-order.
        if (!overflowList) return;
        Array.from(overflowList.children).forEach((li) => {
          const btn = li.firstElementChild;
          if (btn) tabsHost.appendChild(btn);
        });
        overflowList.innerHTML = '';
      };

      const sortByOriginalOrder = () => {
        const items = Array.from(tabsHost.querySelectorAll('.subtab'));
        items.sort((a, b) => Number(a.dataset.order) - Number(b.dataset.order))
             .forEach((el) => tabsHost.appendChild(el));
      };

      // Marque l'ordre original une fois pour pouvoir restaurer.
      Array.from(tabsHost.querySelectorAll('.subtab')).forEach((el, i) => {
        el.dataset.order = i;
      });

      const syncOverflow = () => {
        if (!bar || !moreBtn || !overflowList) return;
        restoreAll();
        sortByOriginalOrder();

        if (!isMobile()) {
          moreBtn.hidden = true;
          moreBtn.setAttribute('aria-expanded', 'false');
          overflowList.hidden = true;
          return;
        }

        const barWidth = bar.clientWidth;
        const moreWidth = 36; // largeur du bouton + petit padding
        const gap = parseFloat(getComputedStyle(tabsHost).columnGap) || 0;
        const items = Array.from(tabsHost.querySelectorAll('.subtab'));

        let total = 0;
        let overflowStart = -1;
        for (let i = 0; i < items.length; i++) {
          total += items[i].offsetWidth + (i > 0 ? gap : 0);
          if (total > barWidth - moreWidth) {
            overflowStart = i;
            break;
          }
        }

        if (overflowStart >= 0) {
          for (let i = overflowStart; i < items.length; i++) {
            const li = document.createElement('li');
            li.appendChild(items[i]);
            overflowList.appendChild(li);
          }
          moreBtn.hidden = false;
        } else {
          moreBtn.hidden = true;
        }
        // Toujours fermé après resync.
        moreBtn.setAttribute('aria-expanded', 'false');
        overflowList.hidden = true;
      };

      const closeOverflow = () => {
        if (!moreBtn) return;
        moreBtn.setAttribute('aria-expanded', 'false');
        if (overflowList) overflowList.hidden = true;
      };

      const openOverflow = () => {
        if (!moreBtn) return;
        moreBtn.setAttribute('aria-expanded', 'true');
        if (overflowList) overflowList.hidden = false;
        document.body.classList.add('cats-open');
      };
      const closeOverflowAndBlur = () => {
        if (!moreBtn) return;
        moreBtn.setAttribute('aria-expanded', 'false');
        if (overflowList) overflowList.hidden = true;
        document.body.classList.remove('cats-open');
      };
      if (moreBtn && overflowList) {
        moreBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const open = moreBtn.getAttribute('aria-expanded') === 'true';
          if (open) closeOverflowAndBlur();
          else openOverflow();
        });
        document.addEventListener('click', (e) => {
          if (!moreBtn.contains(e.target) && !overflowList.contains(e.target)) {
            closeOverflowAndBlur();
          }
        });
      }

      syncOverflow();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncOverflow);
      window.addEventListener('load', syncOverflow);
      window.addEventListener('resize', syncOverflow);

      // Click handler delegated au niveau .categories-col pour attraper
      // les clics dans tabsHost ET dans overflow (mêmes .subtab buttons).
      const categoriesCol = document.querySelector('.categories-col');
      categoriesCol.addEventListener('click', (e) => {
        const btn = e.target.closest('.subtab[data-bucket]');
        if (!btn) return;
        e.preventDefault();
        activeBucket = btn.dataset.bucket;
        document.querySelectorAll('.categories-col .subtab').forEach(b => {
          if (b.dataset.bucket === activeBucket) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
        closeOverflowAndBlur();
        requestAnimationFrame(scrollToActiveBucket);
      });

      // Suit la position du scroll : marque comme active la bucket-section
      // dont la majorité est visible. Met à jour aria-current sur les
      // tabs en conséquence.
      let scrollObserver = null;
      const setActiveFromScroll = (key) => {
        if (key === activeBucket) return;
        activeBucket = key;
        document.querySelectorAll('.categories-col .subtab').forEach(b => {
          if (b.dataset.bucket === key) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      };
      const observeBucketSections = () => {
        if (scrollObserver) scrollObserver.disconnect();
        const sections = container.querySelectorAll('.bucket-section');
        if (!sections.length) return;
        // rootMargin top négatif = la "ligne d'activation" est sous les
        // bars sticky (header + subtabs + tabs categories). Bottom négatif
        // pour ne déclencher qu'à partir du moment où la section occupe
        // la moitié haute du viewport.
        const stickyOffset = (document.querySelector('.header')?.offsetHeight || 60)
                           + (document.querySelector('.subtabs-row')?.offsetHeight || 50)
                           + (document.querySelector('.categories-col')?.offsetHeight || 56);
        scrollObserver = new IntersectionObserver((entries) => {
          // Choisit la section la plus haute parmi celles qui sont visibles.
          const visible = entries
            .filter(e => e.isIntersecting)
            .map(e => ({ el: e.target, top: e.boundingClientRect.top }))
            .sort((a, b) => a.top - b.top);
          if (visible.length) {
            setActiveFromScroll(visible[0].el.dataset.bucket);
          }
        }, {
          rootMargin: `-${stickyOffset + 4}px 0px -50% 0px`,
          threshold: 0,
        });
        sections.forEach(s => scrollObserver.observe(s));
      };

      fetch('candidates.json').then(r => r.json()).then(c => {
        candidates = c;
        renderTestimonials();
        requestAnimationFrame(observeBucketSections);
        // Si l'URL contient #bucket-xxx, le navigateur a essayé de
        // scroller avant que les sections existent. On scrolle à la
        // main maintenant qu'elles sont rendues.
        if (location.hash && location.hash.startsWith('#bucket-')) {
          const target = document.querySelector(location.hash);
          if (target) requestAnimationFrame(() => target.scrollIntoView({ block: 'start' }));
        }
      }).catch(err => {
        console.error('Failed to load data:', err);
        container.innerHTML = '<div class="empty-state">Impossible de charger les témoignages.</div>';
      });
    })();
  </script>
</body>
</html>
