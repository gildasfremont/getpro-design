<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GetPro · +2000 recrutements</title>
<meta name="description" content="Plus de 2000 recrutements depuis 2015 sur le secteur de l'innovation : Tech, Product, Data, Sales, Marketing, Ops, RH et C-level." />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<meta property="og:title" content="GetPro · +2000 recrutements" />
<meta property="og:description" content="Plus de 2000 recrutements depuis 2015 sur le secteur de l'innovation : Tech, Product, Data, Sales, Marketing, Ops, RH et C-level." />
<meta property="og:type" content="website" />
<meta property="og:locale" content="fr_FR" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="styles.css" />
<style>
  /* View tabs : toggle Placements / Témoignages au top du content */
  .view-tabs {
    display: flex;
    gap: clamp(20px, 3vw, 50px);
    margin-bottom: clamp(28px, 3.4vw, 50px);
    padding-block: clamp(20px, 2.4vw, 32px) 0;
    border-bottom: 1px solid var(--line);
  }
  .view-tab {
    padding: 0 0 clamp(10px, 1.2vw, 16px);
    font-size: clamp(16px, 1.6vw, 22px);
    line-height: 1.25;
    background: none;
    color: inherit;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .view-tab[aria-current="true"] {
    border-bottom-color: var(--ink);
  }
  .view-body[hidden] { display: none; }

  /* Profiles area : flat vertical list of bucket-sections */
  .profiles-area {
    font-size: var(--fs-body);
    line-height: var(--lh-body);
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 3vw, 44px);
  }
  .bucket-section {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 1.4vw, 18px);
  }
  .bucket-section-title {
    font-size: clamp(20px, 2.2vw, 28px);
    line-height: 1.2;
    margin: 0;
  }
  .profiles-block {
    display: flex;
    flex-direction: column;
    gap: clamp(2px, 0.3vw, 6px);
  }
  .profiles-sub-title {
    font-size: clamp(13px, 1.1vw, 15px);
    line-height: 1.25;
    opacity: 0.6;
    margin: 0 0 clamp(8px, 1vw, 12px);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .profile {
    color: inherit;
    display: block;
    padding: clamp(2px, 0.3vw, 4px) 0;
  }
  .empty-state {
    padding: 40px 0;
    opacity: 0.6;
    font-size: var(--fs-body);
  }

  /* Témoignages : groupés par boîte */
  .testimonials {
    display: flex;
    flex-direction: column;
    gap: clamp(36px, 4vw, 60px);
  }
  .company-block {
    display: grid;
    grid-template-columns: minmax(0, clamp(80px, 9vw, 130px)) minmax(0, 1fr);
    gap: clamp(20px, 3vw, 50px);
    align-items: start;
  }
  .company-logo-cell img {
    height: clamp(20px, 2vw, 28px);
    width: auto;
    max-width: 100%;
    object-fit: contain;
    object-position: left center;
    display: block;
  }
  .company-name-fallback {
    font-size: clamp(16px, 1.6vw, 20px);
    line-height: 1.25;
    opacity: 0.6;
  }
  .company-testimonials {
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 3vw, 44px);
    max-width: var(--measure);
  }
  .testimonial-card {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.2vw, 14px);
  }
  .testimonial-quote {
    font-size: var(--fs-body);
    line-height: var(--lh-body);
    margin: 0;
  }
  .testimonial-author {
    display: flex;
    flex-direction: column;
    font-size: clamp(13px, 1.1vw, 16px);
    line-height: 1.3;
    opacity: 0.72;
  }
  @media (max-width: 700px) {
    .company-block { grid-template-columns: 1fr; gap: clamp(12px, 2vw, 20px); }
  }
</style>
</head>
<body>
  <main class="home">

    <header class="header section" data-nav></header>

    <section class="solutions section" id="solutions" style="scroll-margin-top: clamp(60px, 6vw, 80px);">
      <div class="solutions-head">
        <h1 class="page-title">Services</h1>
        <nav class="tabs" aria-label="Services">
            <a class="tab" href="services-tech.html#solutions" aria-current="page">Recrutements ponctuels</a>
            <a class="tab" href="services-renfort.html#solutions">Renfort en recrutement (RPO)</a>
            <a class="tab" href="services-transition.html#solutions">Temps partagés &amp; Transition</a>
        </nav>
      </div>

      <div class="panel" data-solution="profils">
        <div class="subtabs-row">
          <nav class="subtabs" aria-label="Practices">
            <a class="subtab" href="services-tech.html#solutions">Tech, IA &amp; Data</a>
            <a class="subtab" href="services-produit.html#solutions">Product &amp; Projects</a>
            <a class="subtab" href="services-sales.html#solutions">Customer &amp; Admin</a>
            <a class="subtab" href="services-profils.html" aria-current="page">+2000 recrutements</a>
          </nav>
        </div>

        <div class="subtab-body" data-subtab="profils">
          <section class="panel-section">
            <div class="view-tabs" role="tablist" aria-label="Vue Placements / Témoignages">
              <button class="view-tab" role="tab" data-view="postes" aria-current="true">Placements</button>
              <button class="view-tab" role="tab" data-view="rdx">Témoignages</button>
            </div>

            <div class="view-body" data-view="postes">
              <div class="profiles-area" id="profiles-area"></div>
            </div>

            <div class="view-body view-rdx" data-view="rdx" hidden>
              <div class="testimonials" id="candidate-testimonials"></div>
            </div>
          </section>
        </div>
      </div>

    </section>

    <footer class="site-footer" data-footer></footer>

  </main>
  <script src="partials.js" defer></script>
  <script>
    (function() {
      const profilesArea = document.getElementById('profiles-area');
      const container = document.getElementById('candidate-testimonials');
      const viewTabsHost = document.querySelector('.view-tabs');
      const escape = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

      // Ordre fixe des buckets : on lit metiers.json dans cet ordre.
      const BUCKET_ORDER = [
        { key: 'tech',     label: 'Tech' },
        { key: 'product',  label: 'Product' },
        { key: 'data',     label: 'Data' },
        { key: 'sales',    label: 'Sales & Customer' },
        { key: 'marketing',label: 'Marketing' },
        { key: 'ops',      label: 'Ops & Admin' },
        { key: 'hr',       label: 'RH' },
        { key: 'c-level',  label: 'C-level' },
      ];

      function activateView(target) {
        viewTabsHost.querySelectorAll('.view-tab').forEach(b => {
          if (b.dataset.view === target) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
        document.querySelectorAll('.view-body[data-view]').forEach(v => {
          if (v.dataset.view === target) v.removeAttribute('hidden');
          else v.setAttribute('hidden', '');
        });
      }

      // Deep-link via #temoignages | #rdx
      const initHash = (location.hash || '').replace(/^#/, '');
      if (/^(temoignages?|rdx)$/i.test(initHash)) activateView('rdx');

      viewTabsHost.addEventListener('click', (e) => {
        const btn = e.target.closest('.view-tab[data-view]');
        if (!btn) return;
        activateView(btn.dataset.view);
      });

      let metiers = {};
      let candidates = [];

      function renderProfiles() {
        profilesArea.innerHTML = BUCKET_ORDER.map(({ key, label }) => {
          const data = metiers[key];
          if (!data) return '';
          let inner = '';
          if (data.sub) {
            const subs = Object.entries(data.sub).filter(([, s]) => s.postes.length > 0);
            inner = subs.map(([slug, s]) => {
              const list = s.postes.map(p => `<span class="profile">${escape(p.name)}</span>`).join('');
              return `<div class="profiles-block">
                <h4 class="profiles-sub-title">${escape(s.label)}</h4>
                ${list}
              </div>`;
            }).join('');
          } else {
            const list = data.postes.map(p => `<span class="profile">${escape(p.name)}</span>`).join('');
            inner = `<div class="profiles-block">${list}</div>`;
          }
          return `<section class="bucket-section">
            <h3 class="bucket-section-title">${escape(label)}</h3>
            ${inner}
          </section>`;
        }).join('');
      }

      function renderTestimonials() {
        const html = BUCKET_ORDER.map(({ key, label }) => {
          const list = candidates.filter(c => c.bucket === key);
          if (list.length === 0) return '';
          const groups = new Map();
          for (const c of list) {
            const k = c.company_slug;
            if (!groups.has(k)) groups.set(k, { meta: c, items: [] });
            groups.get(k).items.push(c);
          }
          const blocks = Array.from(groups.values()).map(({ meta, items }) => {
            const logoOrName = meta.has_logo
              ? `<img src="assets/${meta.company_slug}.svg" alt="${escape(meta.company_name)}" />`
              : `<span class="company-name-fallback">${escape(meta.company_name)}</span>`;
            const cards = items.map(c => {
              const role = c.poste_canonique || c.intitule_original || 'Recruté';
              return `<article class="testimonial-card">
                <p class="testimonial-quote">« ${escape(c.text)} »</p>
                <div class="testimonial-author">
                  <span>${escape(c.consumer_name)}</span>
                  <span>${escape(role)}</span>
                </div>
              </article>`;
            }).join('');
            return `<div class="company-block">
              <div class="company-logo-cell">${logoOrName}</div>
              <div class="company-testimonials">${cards}</div>
            </div>`;
          }).join('');
          return `<section class="bucket-section">
            <h3 class="bucket-section-title">${escape(label)}</h3>
            ${blocks}
          </section>`;
        }).join('');
        container.innerHTML = html || `<div class="empty-state">Aucun témoignage candidat pour le moment.</div>`;
      }

      Promise.all([
        fetch('metiers.json').then(r => r.json()),
        fetch('candidates.json').then(r => r.json())
      ]).then(([m, c]) => {
        metiers = m;
        candidates = c;
        renderProfiles();
        renderTestimonials();
      }).catch(err => {
        console.error('Failed to load data:', err);
        profilesArea.innerHTML = '<div class="empty-state">Impossible de charger les profils pour le moment. Réessayez plus tard.</div>';
        container.innerHTML = '';
      });
    })();
  </script>
</body>
</html>
