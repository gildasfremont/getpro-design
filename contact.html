<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GetPro · Contact</title>
<meta name="description" content="Parlez-nous de votre projet de recrutement. Mission lancée sous 48 heures, shortlist commentée en 60 minutes, time-to-fill moyen de 50 jours." />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<meta property="og:title" content="GetPro · Contact" />
<meta property="og:description" content="Parlez-nous de votre projet de recrutement. Mission lancée sous 48 heures, shortlist commentée en 60 minutes." />
<meta property="og:type" content="website" />
<meta property="og:locale" content="fr_FR" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="styles.css" />
<style>
  /* ---------- Contact ---------- */
  .contact {
    display: flex;
    flex-direction: column;
    gap: clamp(40px, 4.5vw, 70px);
    padding-bottom: var(--gap-section);
  }

  /* Hero : email + tel + RDV en titre, taille modérée */
  .contact-head h1 {
    font-size: clamp(28px, 3.6vw, 56px);
    line-height: 1.15;
    letter-spacing: -0.02em;
    font-weight: 400;
  }
  .contact-head h1 a {
    text-decoration: underline;
    text-decoration-thickness: clamp(1.5px, 0.15vw, 3px);
    text-underline-offset: clamp(4px, 0.5vw, 8px);
    color: inherit;
    transition: text-decoration-thickness 0.18s ease;
  }
  .contact-head h1 a:hover {
    text-decoration-thickness: clamp(2.5px, 0.25vw, 5px);
  }

  /* Panel formulaire : contient les value props ET le form */
  .form-panel {
    background: var(--white);
    padding: clamp(40px, 6.4vw, 100px) var(--pad-card-x);
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .form-panel-inner {
    width: 100%;
    max-width: 820px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: clamp(40px, 4.5vw, 70px);
  }

  /* Bandeau value props : 2 colonnes serrées, sans label, hairline en bas */
  .contact-props {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: clamp(40px, 5vw, 80px);
    row-gap: clamp(28px, 3vw, 44px);
  }
  .prop-block {
    display: flex;
    flex-direction: column;
    gap: clamp(16px, 1.8vw, 24px);
  }
  .prop-block ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.2vw, 16px);
    font-size: clamp(16px, 1.8vw, 22px);
    line-height: 1.3;
    letter-spacing: -0.01em;
  }
  .prop-block li {
    display: flex;
    align-items: center;
    gap: clamp(8px, 0.8vw, 12px);
  }
  .prop-block li .inline-mark {
    height: clamp(14px, 1.2vw, 18px);
    width: auto;
    display: inline-block;
    vertical-align: middle;
    object-fit: contain;
  }

  /* Bandeau de logos clients (monochromes) */
  .prop-logos {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: clamp(20px, 2.5vw, 36px);
    margin-top: clamp(4px, 0.6vw, 10px);
  }
  .prop-logos img {
    height: clamp(18px, 1.8vw, 26px);
    width: auto;
    object-fit: contain;
    object-position: left center;
    filter: grayscale(100%);
    opacity: 0.9;
  }

  /* Form : grille unifiée avec hairlines entre les champs.
     Technique : grid avec gap 1px + bg ink-line qui transparaît dans les
     gaps. Chaque .form-field a son propre bg var(--bg), label inside top,
     input below — pas de marge entre les champs. */
  .contact-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: rgba(6, 32, 4, 0.15);
    border: 1px solid rgba(6, 32, 4, 0.15);
  }
  .form-field {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding: clamp(14px, 1.4vw, 20px) clamp(18px, 1.8vw, 24px);
    transition: background 0.15s ease;
  }
  .form-field--full { grid-column: 1 / -1; }

  .form-field label {
    font-size: clamp(13px, 1vw, 14px);
    line-height: 1.2;
    color: var(--ink);
    opacity: 0.7;
    margin-bottom: clamp(4px, 0.4vw, 6px);
  }
  .form-field input,
  .form-field textarea {
    width: 100%;
    padding: 0;
    background: transparent;
    border: none;
    font: inherit;
    font-size: clamp(16px, 1.6vw, 20px);
    line-height: 1.4;
    color: var(--ink);
    border-radius: 0;
  }
  .form-field input::placeholder,
  .form-field textarea::placeholder {
    color: var(--ink);
    opacity: 0.35;
  }
  .form-field input:focus,
  .form-field textarea:focus {
    outline: none;
  }
  .form-field:focus-within {
    background: var(--white);
  }
  .form-field textarea {
    min-height: clamp(120px, 14vw, 200px);
    resize: vertical;
  }

  .form-submit {
    grid-column: 1 / -1;
    background: var(--bg);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: clamp(20px, 2.4vw, 36px);
    padding: clamp(16px, 1.8vw, 24px) clamp(18px, 1.8vw, 24px);
  }
  .form-promise {
    font-size: var(--fs-menu);
    line-height: 1.3;
  }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: clamp(14px, 1.4vw, 20px) clamp(28px, 2.8vw, 40px);
    background: var(--ink);
    color: var(--white);
    font-size: clamp(16px, 1.65vw, 22px);
    line-height: 1.25;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    border-radius: clamp(4px, 0.4vw, 6px);
    transition: background 0.18s ease;
  }
  .btn-primary:hover { background: #0a3209; }

  @media (max-width: 800px) {
    .contact-props { grid-template-columns: 1fr; }
    .contact-form  { grid-template-columns: 1fr; }
    .form-submit   { flex-direction: column; align-items: stretch; }
    .form-submit .btn-primary { justify-content: center; }
  }
</style>
</head>
<body>
  <main class="home">

    <header class="header section" data-nav></header>

    <section class="contact section">

      <div class="contact-head">
        <h1><a href="mailto:bonjour@getpro.com">bonjour@getpro.com</a>,<br><a href="tel:+33939289329">09 39 28 93 29</a><br>ou prenez RDV :</h1>
      </div>

      <div class="form-panel">
        <div class="form-panel-inner">

          <div class="contact-props">
            <div class="prop-block">
              <ul>
                <li>Mission lancée sous 48 heures</li>
                <li>Shortlist commentée en 60 minutes</li>
                <li>Time-to-fill moyen de 50 jours</li>
              </ul>
            </div>
            <div class="prop-block">
              <ul>
                <li>800 recrutements cette année</li>
                <li>Expérience candidat 5&nbsp;étoiles <img class="inline-mark" src="assets/trustfolio.svg" alt="Trustfolio" /></li>
              </ul>
            </div>
          </div>

          <form class="contact-form" action="mailto:bonjour@getpro.com" method="POST" enctype="text/plain">
            <div class="form-field form-field--full">
              <label for="description">Que pouvons-nous faire pour vous aider&nbsp;?</label>
              <textarea id="description" name="description" required autofocus placeholder="Le poste à pourvoir, le contexte, les contraintes de timing…"></textarea>
            </div>

            <div class="form-field form-field--full">
              <label for="name">Prénom et nom</label>
              <input id="name" name="name" type="text" required autocomplete="name" />
            </div>

            <div class="form-field">
              <label for="company">Entreprise</label>
              <input id="company" name="company" type="text" required autocomplete="organization" />
            </div>
            <div class="form-field">
              <label for="phone">Téléphone</label>
              <input id="phone" name="phone" type="tel" required autocomplete="tel" />
            </div>

            <div class="form-field form-field--full">
              <label for="email">E-mail</label>
              <input id="email" name="email" type="email" required autocomplete="email" />
            </div>

            <div class="form-submit">
              <div class="prop-logos">
                <img src="assets/logos-mono/decathlon.svg" alt="Decathlon" />
                <img src="assets/logos-mono/carrefour_wordmark.svg" alt="Carrefour" />
                <img src="assets/logos-mono/porsche-france.svg" alt="Porsche France" />
                <img src="assets/logos-mono/voggt.png" alt="Voggt" />
              </div>
              <button type="submit" class="btn-primary">Prendre RDV →</button>
            </div>
          </form>

        </div>
      </div>

    </section>

    <footer class="site-footer" data-footer></footer>

  </main>
  <script src="partials.js" defer></script>
</body>
</html>
