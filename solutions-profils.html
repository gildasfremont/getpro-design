<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GetPro — Profils couverts</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .solutions {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding-bottom: var(--gap-section);
  }

  .solutions-head {
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 1.4vw, 20px);
  }

  .solutions-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: clamp(20px, 3vw, 50px);
  }

  /* Ratings — shared in styles.css */

  .breadcrumb {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: var(--fs-body);
    line-height: 1.3;
  }
  .breadcrumb a { text-decoration: underline; text-underline-offset: 3px; }
  .breadcrumb .sep { opacity: 0.6; }
  .breadcrumb .current { opacity: 0.85; }

  .panel {
    background: var(--white);
    padding: var(--pad-card-y) var(--pad-card-x);
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 3.4vw, 50px);
  }

  .panel-title {
    font-size: var(--fs-card-title);
    line-height: var(--lh-card-title);
  }

  /* Vertical bucket nav (left side) */
  .panel-body {
    display: grid;
    grid-template-columns: minmax(160px, 0.7fr) minmax(0, 3fr);
    gap: clamp(28px, 4vw, 60px);
    align-items: start;
  }
  .subtabs {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1vw, 14px);
  }
  .subtab {
    padding: 0;
    font-size: var(--fs-body);
    line-height: 1.4;
    cursor: pointer;
    background: none;
    border: none;
    color: inherit;
    font-family: inherit;
    text-align: left;
    display: inline-block;
    width: max-content;
  }
  .subtab[aria-current="true"] {
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  /* Profiles area: adaptive 1 / 2 / 3 columns */
  .profiles-area {
    font-size: var(--fs-body);
    line-height: 1.4;
  }
  /* Flat buckets: CSS columns with count set by JS via data-cols */
  .profiles-area[data-cols="1"] { column-count: 1; }
  .profiles-area[data-cols="2"] { column-count: 2; }
  .profiles-area[data-cols="3"] { column-count: 3; }
  .profiles-area[data-cols] {
    column-gap: clamp(24px, 4vw, 60px);
  }

  /* With sub-categories: grid auto-fit blocks */
  .profiles-area--subs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: clamp(28px, 4vw, 60px);
    align-items: start;
  }

  .profiles-block {
    break-inside: avoid;
    margin-bottom: clamp(24px, 3vw, 40px);
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.2vw, 16px);
  }

  .profiles-sub-label {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: clamp(11px, 1vw, 14px);
    opacity: 0.55;
    margin-bottom: clamp(2px, 0.3vw, 6px);
  }

  .profile {
    color: inherit;
    display: block;
    padding: clamp(4px, 0.5vw, 6px) 0;
    break-inside: avoid;
  }

  .empty-state {
    padding: 40px 0;
    color: var(--ink);
    opacity: 0.6;
    font-size: var(--fs-body);
  }

  /* Testimonial cards (below panel) */
  .testimonials {
    display: flex;
    flex-direction: column;
    gap: clamp(20px, 2.5vw, 40px);
    margin-top: clamp(24px, 3vw, 50px);
  }

  .testimonial-card {
    display: grid;
    grid-template-columns: clamp(240px, 30vw, 440px) minmax(0, 1fr);
    background: var(--white);
    overflow: hidden;
  }

  /* Testimonial cover : aplat noir + logo de la boîte en blanc, centré */
  .testimonial-photo {
    aspect-ratio: 1 / 1;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18%;
  }
  .testimonial-photo img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: invert(1) brightness(2);
  }
  .testimonial-photo .brand-text {
    color: var(--bg);
    font-size: clamp(20px, 2.6vw, 36px);
    line-height: 1.1;
    text-align: center;
    letter-spacing: -0.02em;
  }

  .testimonial-body {
    padding: clamp(30px, 4.5vw, 70px) clamp(30px, 5vw, 80px);
    display: grid;
    grid-template-rows: 1fr auto;
    gap: clamp(20px, 2.5vw, 40px);
  }

  .testimonial-quote {
    font-size: var(--fs-card-sub);
    line-height: var(--lh-card-sub);
  }

  .testimonial-footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
  }

  .testimonial-author .name { font-size: var(--fs-body); line-height: 1.3; }
  .testimonial-author .role { font-size: var(--fs-body); line-height: 1.3; opacity: 0.7; }

  .client-mark {
    flex: none;
    width: clamp(70px, 7vw, 100px);
    height: clamp(20px, 2vw, 30px);
  }
  .client-mark img {
    height: 100%;
    width: 100%;
    object-fit: contain;
    object-position: right center;
  }

  @media (max-width: 800px) {
    .panel-title { max-width: none; }
    .solutions-title-row { flex-direction: column; align-items: flex-start; }
    .panel-body { grid-template-columns: 1fr; }
    .subtabs { flex-direction: row; flex-wrap: wrap; gap: 12px 24px; }
    .testimonial-card { grid-template-columns: 1fr; }
    .testimonial-photo { aspect-ratio: 4 / 3; }
  }
</style>
</head>
<body>
  <main class="home">

    <header class="header section" data-nav></header>

    <section class="solutions section">
      <div class="solutions-head">
        <div class="solutions-title-row">
          <h1 class="page-title">Solutions</h1>
          <div class="ratings-row">
            <div class="rating">
              <img src="assets/trustpilot.svg" alt="Trustpilot" class="rating-logo" />
              <span class="rating-stars">5 ★★★★★</span>
            </div>
            <div class="rating">
              <img src="assets/trustfolio.svg" alt="Trustfolio" class="rating-logo" />
              <span class="rating-stars">4,8 ★★★★★</span>
            </div>
          </div>
        </div>
        <nav class="breadcrumb">
          <a href="solutions.html">Chasse</a>
          <span class="sep">/</span>
          <span class="current">Profils</span>
        </nav>
      </div>

      <div class="panel">
        <h2 class="panel-title">+2000 talents récrutés sur toute la chaine de valeur d'innovation</h2>

        <div class="panel-body">
          <div class="subtabs" role="tablist" id="bucket-tabs">
            <button class="subtab" role="tab" data-bucket="tech" aria-current="true">Tech</button>
            <button class="subtab" role="tab" data-bucket="product">Product</button>
            <button class="subtab" role="tab" data-bucket="data">Data</button>
            <button class="subtab" role="tab" data-bucket="sales">Sales &amp; Customer</button>
            <button class="subtab" role="tab" data-bucket="marketing">Marketing</button>
            <button class="subtab" role="tab" data-bucket="ops">Ops. &amp; Admin</button>
            <button class="subtab" role="tab" data-bucket="hr">HR</button>
            <button class="subtab" role="tab" data-bucket="c-level">C-level</button>
          </div>

          <div class="profiles-area" id="profiles-area"></div>
        </div>
      </div>

      <div class="testimonials" id="candidate-testimonials"></div>

    </section>

    <footer class="site-footer" data-footer></footer>

  </main>
  <script src="partials.js" defer></script>
  <script>
    (function() {
      const tabsHost = document.getElementById('bucket-tabs');
      const profilesArea = document.getElementById('profiles-area');
      const container = document.getElementById('candidate-testimonials');
      const escape = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

      let metiers = {};
      let candidates = [];
      let activeBucket = 'tech';

      function renderProfiles() {
        const data = metiers[activeBucket];
        if (!data) return;

        profilesArea.removeAttribute('data-cols');
        profilesArea.classList.remove('profiles-area--subs');

        // Bucket with sub-categories (tech, product)
        if (data.sub) {
          profilesArea.classList.add('profiles-area--subs');
          const subs = Object.values(data.sub).filter(s => s.postes.length > 0);
          profilesArea.innerHTML = subs.map(s => {
            const list = s.postes.map(p => `<span class="profile">${escape(p.name)}</span>`).join('');
            return `<div class="profiles-block">
              <div class="profiles-sub-label">${escape(s.label)}</div>
              ${list}
            </div>`;
          }).join('');
          return;
        }

        // Flat bucket: 1 col up to 12 items, 2 cols up to 22, 3 cols beyond
        const postes = data.postes;
        const cols = postes.length <= 12 ? 1 : postes.length <= 22 ? 2 : 3;
        profilesArea.setAttribute('data-cols', String(cols));
        profilesArea.innerHTML = postes.map(p =>
          `<span class="profile">${escape(p.name)}</span>`
        ).join('');
      }

      function filteredCandidates() {
        return candidates.filter(c => c.bucket === activeBucket);
      }

      function renderTestimonials() {
        const list = filteredCandidates();
        if (list.length === 0) {
          container.innerHTML = `<div class="empty-state">Aucun témoignage candidat dans cette catégorie pour le moment.</div>`;
          return;
        }
        container.innerHTML = list.map((c) => {
          const cover = c.has_logo
            ? `<img src="assets/${c.company_slug}.svg" alt="${escape(c.company_name)}" />`
            : `<span class="brand-text">${escape(c.company_name)}</span>`;
          const role = c.poste_canonique || c.intitule_original || 'Recruté';
          return `
            <article class="testimonial-card">
              <div class="testimonial-photo" role="img" aria-label="${escape(c.company_name)}">${cover}</div>
              <div class="testimonial-body">
                <p class="testimonial-quote">“${escape(c.text)}”</p>
                <div class="testimonial-footer">
                  <div class="testimonial-author">
                    <div class="name">${escape(c.consumer_name)}</div>
                    <div class="role">${escape(role)} chez ${escape(c.company_name)}</div>
                  </div>
                </div>
              </div>
            </article>`;
        }).join('');
      }

      tabsHost.addEventListener('click', (e) => {
        const btn = e.target.closest('.subtab[data-bucket]');
        if (!btn) return;
        e.preventDefault();
        activeBucket = btn.dataset.bucket;
        tabsHost.querySelectorAll('.subtab').forEach(b => {
          if (b === btn) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
        renderProfiles();
        renderTestimonials();
      });

      Promise.all([
        fetch('metiers.json').then(r => r.json()),
        fetch('candidates.json').then(r => r.json())
      ]).then(([m, c]) => {
        metiers = m;
        candidates = c;
        renderProfiles();
        renderTestimonials();
      }).catch(err => console.error('Failed to load data:', err));
    })();
  </script>
</body>
</html>
