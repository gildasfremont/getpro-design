<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GetPro Métiers</title>
<meta name="description" content="+2000 talents recrutés sur Tech, Product, Data, Sales, Marketing, Ops et C-level. La cartographie des profils que GetPro chasse au quotidien." />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<meta property="og:title" content="GetPro Métiers" />
<meta property="og:description" content="+2000 talents recrutés sur Tech, Product, Data, Sales, Marketing, Ops et C-level. La cartographie des profils que GetPro chasse au quotidien." />
<meta property="og:type" content="website" />
<meta property="og:locale" content="fr_FR" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="styles.css" />
<style>
  .solutions {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding-bottom: var(--gap-section);
  }
  /* .solutions-head + .solutions-title-row : règles globales dans
     styles.css (cf. solutions-cdi.html / solutions-rpo.html). */

  /* Col 2 du panel-body : view-tabs (Postes / Retour d'expérience) en
     haut, et le contenu de la vue active en dessous. Le filtrage par
     catégorie (col 1) s'applique aux deux vues. */
  .content-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "tabs tabs"
      "postes rdx";
    column-gap: clamp(28px, 3.4vw, 50px);
    row-gap: clamp(28px, 3.4vw, 50px);
    min-width: 0;
    /* Indispensable pour que la col rdx puisse déborder à droite. */
    overflow: visible;
  }
  .view-tabs { grid-area: tabs; }
  .view-body[data-view="postes"] { grid-area: postes; min-width: 0; }
  .view-body[data-view="rdx"]   { grid-area: rdx; min-width: 0; max-width: none; }

  /* Quand la vue Témoignages est en preview (tab Placements active),
     la col rdx s'élargit au-delà du panel blanc : on voit le début
     des citations dans la zone du panel, le reste déborde sur le bg. */
  .content-col[data-active-view="postes"] .view-body[data-view="rdx"] .testimonials {
    width: clamp(400px, 55vw, 720px);
    max-width: none;
  }
  /* Quand Témoignages est active, on revient à la mesure de lecture. */
  .content-col[data-active-view="rdx"] .view-body[data-view="rdx"] .testimonials {
    width: auto;
    max-width: var(--measure);
  }

  /* Inactif : grisé + cursor pointer pour signifier la cliquabilité. */
  .view-body { transition: opacity 0.3s ease, width 0.4s ease; }
  .content-col[data-active-view="postes"] .view-body[data-view="rdx"],
  .content-col[data-active-view="rdx"] .view-body[data-view="postes"] {
    opacity: 0.35;
    cursor: pointer;
  }
  .view-tabs {
    display: inline-flex;
    align-self: flex-start;
    gap: clamp(20px, 3vw, 50px);
    border-bottom: 1px solid var(--line);
    margin-bottom: clamp(28px, 3.4vw, 50px);
  }
  .view-tab {
    /* Pas de padding-top : Placements aligne sa baseline sur "Tech" dans
       la col 1. Petit padding-bottom pour le trait actif. */
    padding: 0 0 clamp(10px, 1.2vw, 16px);
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.25;
    background: none;
    border: none;
    color: inherit;
    font-family: inherit;
    cursor: pointer;
    position: relative;
    white-space: nowrap;
  }
  .view-tab[aria-current="true"]::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--ink);
  }
  .view-body[hidden] { display: block; } /* hidden no longer hides : both views shown side-by-side */

  /* Permet à la col Témoignages de déborder à droite du panel blanc. */
  .panel { overflow: visible; }
  .panel-body { overflow: visible; }

  /* Vue "Postes" : 2 cols categories | profils.
     align-items: baseline → la baseline du 1er texte de chaque col
     s'aligne (Tech ↔ Postes alignés sur le bas du texte, pas sur
     le haut du box). */
  .panel-body {
    display: grid;
    grid-template-columns: minmax(120px, 0.5fr) minmax(0, 1fr);
    gap: clamp(28px, 4vw, 60px);
    align-items: baseline;
  }
  /* Vue "Retour d'expérience" : les témoignages prennent toute la
     largeur du panel, capés à --measure pour la lisibilité. */
  .view-rdx .testimonials {
    max-width: var(--measure);
  }
  /* Col 1 du panel-body : la liste des catégories (subtabs) avec le
     rating Trustpilot dessous. Sticky pour rester visible pendant
     que l'utilisateur scrolle la colonne de droite (postes ou
     témoignages). top: ~100px pour laisser passer la nav sticky
     au-dessus. align-self: start pour ne pas s'étirer sur toute la
     hauteur du grid (sinon sticky n'a rien à faire). */
  .categories-col {
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 3vw, 44px);
    position: -webkit-sticky;
    position: sticky;
    top: clamp(80px, 9vw, 110px);
    align-self: start;
  }
  .subtabs {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1vw, 14px);
  }
  .subtab {
    padding: 0;
    /* Même taille que les noms dans la liste Clients pour rester
       visuellement cohérent (catégories = entrée principale). */
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.25;
    cursor: pointer;
    background: none;
    border: none;
    color: inherit;
    font-family: inherit;
    text-align: left;
    display: inline-block;
    width: max-content;
  }
  .subtab[aria-current="true"] {
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  /* Désactive le pseudo-bar global (.subtab[aria-current]::after,
     une bande 2px de var(--ink) sous le tab) sinon on a un double
     soulignement gras avec le text-decoration ci-dessus. Ici on garde
     uniquement l'underline texte, plus discret. */
  #bucket-tabs .subtab[aria-current="true"]::after { display: none; }
  /* Filtres de sous-catégorie texte plain en row, underline sur
     l'actif. Même langage typographique que le reste du site
     (.subtab, .foot-featured, etc) : pas de pill / pas de bg fill. */
  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(20px, 2.5vw, 40px);
    margin-bottom: clamp(24px, 2.8vw, 40px);
  }
  .filter-chips[hidden] { display: none; }
  .filter-chip {
    padding: 0;
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.25;
    background: none;
    border: none;
    color: inherit;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    text-underline-offset: 5px;
  }
  .filter-chip:hover { text-decoration: underline; }
  .filter-chip[aria-current="true"] {
    text-decoration: underline;
    text-underline-offset: 5px;
    text-decoration-thickness: 1.5px;
  }

  /* Profiles : single column flat list, même taille que la liste
     des noms sur la page Clients. */
  .profiles-area {
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.25;
    display: flex;
    flex-direction: column;
  }
  .profiles-block {
    display: flex;
    flex-direction: column;
    gap: clamp(2px, 0.3vw, 6px);
    margin-bottom: clamp(20px, 2vw, 30px);
  }
  .profiles-block:last-child { margin-bottom: 0; }
  .profile {
    color: inherit;
    display: block;
    padding: clamp(3px, 0.4vw, 5px) 0;
  }

  .empty-state {
    padding: 40px 0;
    color: var(--ink);
    opacity: 0.6;
    font-size: var(--fs-body);
  }

  /* Témoignages groupés par boîte. Chaque .company-block est un grid
     2 cols : logo (sticky) à gauche, liste des témoignages à droite.
     Quand l'utilisateur scrolle dans les témoignages d'une boîte, le
     logo reste visible il libère la place quand on arrive au
     groupe suivant. Reprend le pattern visuel de la liste Clients
     (logo + texte côté). */
  .testimonials {
    display: flex;
    flex-direction: column;
    gap: clamp(48px, 5vw, 80px);
  }
  .company-block {
    display: grid;
    grid-template-columns: minmax(0, clamp(80px, 9vw, 130px)) minmax(0, 1fr);
    gap: clamp(20px, 3vw, 50px);
    align-items: start;
  }
  .company-logo-cell {
    position: -webkit-sticky;
    position: sticky;
    top: clamp(80px, 9vw, 110px);
    align-self: start;
  }
  .company-logo-cell img {
    height: clamp(20px, 2vw, 28px);
    width: auto;
    max-width: 100%;
    object-fit: contain;
    object-position: left center;
    display: block;
  }
  .company-name-fallback {
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.25;
    opacity: 0.6;
  }
  .company-testimonials {
    display: flex;
    flex-direction: column;
    gap: clamp(36px, 4vw, 60px);
  }
  .testimonial-card {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 1.4vw, 18px);
  }
  .testimonial-quote {
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.4;
    max-width: var(--measure);
    margin: 0;
  }
  .testimonial-author {
    display: flex;
    flex-direction: column;
    font-size: clamp(15px, 1.4vw, 18px);
    line-height: 1.3;
  }

  @media (max-width: 700px) {
    .company-block {
      grid-template-columns: 1fr;
      gap: clamp(16px, 2vw, 24px);
    }
    .company-logo-cell {
      position: static;
    }
  }

  /* Trigger "select" : caché en desktop, visible en mobile.
     Affiche la catégorie active + chevron, click → ouvre la liste. */
  .categories-trigger { display: none; }

  @media (max-width: 800px) {
    .panel-title { max-width: none; }
    /* .solutions-title-row : on laisse le flex-wrap global gérer le
       passage à la ligne les autres pages Solutions/Renfort font
       pareil pour rester cohérent à toutes les tailles. */
    .panel-body { grid-template-columns: 1fr; }
    /* En mobile, .categories-col devient un sticky bar :
       - row 1 : trigger "Tech ▾" à gauche + Trustpilot à droite
       - row 2 : la liste bucket-tabs (cachée par défaut, ouverte
         quand on clique le trigger)
       Sticky sur la col entière → reste collée tout le long du
       scroll dans le panel-body (parent grid qui inclut content-col).
       top ≈ hauteur du header sticky pour pas de gap. */
    .categories-col {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "trigger rating"
        "subtabs subtabs";
      align-items: baseline;
      column-gap: clamp(16px, 2vw, 24px);
      row-gap: clamp(16px, 2vw, 24px);
      position: -webkit-sticky;
      position: sticky;
      top: clamp(60px, 6vw, 90px);
      background: var(--white);
      padding: clamp(12px, 1.6vw, 18px) 0;
      z-index: 5;
    }
    .categories-trigger {
      grid-area: trigger;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      padding: 0;
      font-size: clamp(20px, 2.2vw, 30px);
      line-height: 1.2;
      letter-spacing: -0.01em;
      background: none;
      border: none;
      cursor: pointer;
      color: inherit;
      font-family: inherit;
      align-self: center;
      justify-self: start;
    }
    .categories-trigger .chevron {
      transition: transform 0.18s ease;
      flex-shrink: 0;
    }
    .categories-trigger[aria-expanded="true"] .chevron {
      transform: rotate(180deg);
    }
    .categories-col .rating {
      grid-area: rating;
      align-self: center;
      justify-self: end;
    }
    /* Liste cachée par défaut, visible quand on ouvre le trigger */
    #bucket-tabs {
      grid-area: subtabs;
      display: none;
    }
    #bucket-tabs.is-open {
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1vw, 14px);
    }
  }
</style>
</head>
<body>
  <main class="home">

    <header class="header section" data-nav></header>

    <section class="solutions section">
      <div class="solutions-head">
        <h1 class="page-title">Solutions</h1>
        <nav class="tabs" aria-label="Solutions">
            <a class="tab" href="solutions-cdi.html">Chasse</a>
            <a class="tab" href="solutions-rpo.html">Renfort RH</a>
            <a class="btn-outline tab--push-right" href="solutions-profils.html" aria-current="page">+2000 recrutements</a>
        </nav>
      </div>

      <div class="panel">

        <div class="panel-body">
          <div class="categories-col">
            <button class="categories-trigger" type="button" aria-expanded="false" aria-controls="bucket-tabs">
              <span class="categories-trigger-label">Tech</span>
              <svg class="chevron" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <path d="M3.5 5.75L8 10.25l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="subtabs" role="tablist" id="bucket-tabs">
              <button class="subtab" role="tab" data-bucket="tech" aria-current="true">Tech</button>
              <button class="subtab" role="tab" data-bucket="product">Product</button>
              <button class="subtab" role="tab" data-bucket="data">Data</button>
              <button class="subtab" role="tab" data-bucket="sales">Sales &amp; Customer</button>
              <button class="subtab" role="tab" data-bucket="marketing">Marketing</button>
              <button class="subtab" role="tab" data-bucket="ops">Ops. &amp; Admin</button>
              <button class="subtab" role="tab" data-bucket="hr">HR</button>
              <button class="subtab" role="tab" data-bucket="c-level">C-level</button>
            </div>
            <div class="rating">
              <img src="assets/trustpilot.svg" alt="Trustpilot" class="rating-logo" />
              <span class="rating-stars">5 ★★★★★</span>
            </div>
          </div>

          <div class="content-col" data-active-view="postes">
            <div class="view-tabs" role="tablist" aria-label="Vue Placements / Témoignages">
              <button class="view-tab" role="tab" data-view="postes" aria-current="true">Placements</button>
              <button class="view-tab" role="tab" data-view="rdx">Témoignages</button>
            </div>

            <div class="view-body" data-view="postes">
              <div class="filter-chips" role="tablist" id="postes-chips" hidden></div>
              <div class="profiles-area" id="profiles-area"></div>
            </div>

            <div class="view-body view-rdx" data-view="rdx">
              <div class="testimonials" id="candidate-testimonials"></div>
            </div>
          </div>
        </div>
        <a href="clients.html" class="panel-foot-link">Tous nos clients →</a>
      </div>

    </section>

    <footer class="site-footer" data-footer></footer>

  </main>
  <script src="partials.js" defer></script>
  <script>
    (function() {
      const tabsHost = document.getElementById('bucket-tabs');
      const profilesArea = document.getElementById('profiles-area');
      const container = document.getElementById('candidate-testimonials');
      const escape = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

      // View tabs (Postes / Retour d'expérience) : swap des deux blocs
      // .view-body[data-view="postes"] et [data-view="rdx"].
      const viewTabsHost = document.querySelector('.view-tabs');
      if (viewTabsHost) {
        viewTabsHost.addEventListener('click', (e) => {
          const btn = e.target.closest('.view-tab[data-view]');
          if (!btn) return;
          const target = btn.dataset.view;
          viewTabsHost.querySelectorAll('.view-tab').forEach(b => {
            if (b === btn) b.setAttribute('aria-current', 'true');
            else b.removeAttribute('aria-current');
          });
          // Both view-bodies stay visible side-by-side; the parent's
          // data-active-view drives the opacity swap (CSS).
          const contentCol = document.querySelector('.content-col');
          if (contentCol) contentCol.setAttribute('data-active-view', target);
        });
      }

      // Click sur la view-body inactive (grisée) → l'activer aussi
      const setActiveView = (target) => {
        const contentCol = document.querySelector('.content-col');
        if (!contentCol) return;
        contentCol.setAttribute('data-active-view', target);
        if (viewTabsHost) {
          viewTabsHost.querySelectorAll('.view-tab').forEach(b => {
            if (b.dataset.view === target) b.setAttribute('aria-current', 'true');
            else b.removeAttribute('aria-current');
          });
        }
      };
      document.querySelectorAll('.view-body[data-view]').forEach(body => {
        body.addEventListener('click', (e) => {
          const contentCol = document.querySelector('.content-col');
          if (!contentCol) return;
          const target = body.dataset.view;
          if (contentCol.getAttribute('data-active-view') === target) return;
          setActiveView(target);
        });
      });

      let metiers = {};
      let candidates = [];
      let activeBucket = 'tech';
      let activeSub = null; // null = "Tous" (tous les sous-blocs visibles)
      const chipsHost = document.getElementById('postes-chips');

      function renderProfiles() {
        const data = metiers[activeBucket];
        if (!data) return;

        // Bucket avec sous-catégories : si activeSub est set, n'affiche
        // que ce sous-bloc ; sinon affiche tous les sous-blocs. Plus
        // de label en majuscules les chips au-dessus suffisent à
        // signaler la catégorisation.
        if (data.sub) {
          let subs = Object.entries(data.sub).filter(([, s]) => s.postes.length > 0);
          if (activeSub) subs = subs.filter(([slug]) => slug === activeSub);
          profilesArea.innerHTML = subs.map(([, s]) => {
            const list = s.postes.map(p => `<span class="profile">${escape(p.name)}</span>`).join('');
            return `<div class="profiles-block">${list}</div>`;
          }).join('');
          return;
        }

        // Flat bucket : single column, plain list
        const postes = data.postes;
        profilesArea.innerHTML = `<div class="profiles-block">${
          postes.map(p => `<span class="profile">${escape(p.name)}</span>`).join('')
        }</div>`;
      }

      // Chips de filtre des sous-catégories visibles uniquement quand
      // le bucket courant a des sub-catégories (Tech, Product). Un chip
      // par sous-catégorie (pas de "Tous" : par défaut tous les
      // sous-blocs sont visibles, click sur le chip actif le déselectionne
      // pour revenir à la vue d'ensemble).
      function renderChips() {
        if (!chipsHost) return;
        const data = metiers[activeBucket];
        if (!data || !data.sub) {
          chipsHost.hidden = true;
          chipsHost.innerHTML = '';
          return;
        }
        chipsHost.hidden = false;
        const subs = Object.entries(data.sub).filter(([, s]) => s.postes.length > 0);
        chipsHost.innerHTML = subs.map(([slug, s]) =>
          `<button class="filter-chip" data-sub="${escape(slug)}" ${activeSub === slug ? 'aria-current="true"' : ''}>${escape(s.label)}</button>`
        ).join('');
      }

      if (chipsHost) {
        chipsHost.addEventListener('click', (e) => {
          const btn = e.target.closest('.filter-chip[data-sub]');
          if (!btn) return;
          // Click sur le chip actif → deselect (revient à tous les
          // sous-blocs) ; sinon active ce sub.
          activeSub = (btn.dataset.sub === activeSub) ? null : btn.dataset.sub;
          renderProfiles();
          renderChips();
        });
      }

      function filteredCandidates() {
        return candidates.filter(c => c.bucket === activeBucket);
      }

      function renderTestimonials() {
        const list = filteredCandidates();
        if (list.length === 0) {
          container.innerHTML = `<div class="empty-state">Aucun témoignage candidat dans cette catégorie pour le moment.</div>`;
          return;
        }
        // Group by company_slug preserve insertion order = ordre du
        // 1er candidat par boîte rencontré dans la liste filtrée.
        const groups = new Map();
        for (const c of list) {
          const k = c.company_slug;
          if (!groups.has(k)) groups.set(k, { meta: c, items: [] });
          groups.get(k).items.push(c);
        }
        container.innerHTML = Array.from(groups.values()).map(({ meta, items }) => {
          const logoOrName = meta.has_logo
            ? `<img src="assets/${meta.company_slug}.svg" alt="${escape(meta.company_name)}" />`
            : `<span class="company-name-fallback">${escape(meta.company_name)}</span>`;
          const cards = items.map(c => {
            const role = c.poste_canonique || c.intitule_original || 'Recruté';
            return `<article class="testimonial-card">
              <p class="testimonial-quote">“${escape(c.text)}”</p>
              <div class="testimonial-author">
                <div class="name">${escape(c.consumer_name)}</div>
                <div class="role">${escape(role)}</div>
              </div>
            </article>`;
          }).join('');
          return `<div class="company-block">
            <div class="company-logo-cell">${logoOrName}</div>
            <div class="company-testimonials">${cards}</div>
          </div>`;
        }).join('');
      }

      // Trigger "select" du menu catégories en mobile.
      const trigger = document.querySelector('.categories-trigger');
      const triggerLabel = trigger?.querySelector('.categories-trigger-label');
      function closeTrigger() {
        if (!trigger) return;
        trigger.setAttribute('aria-expanded', 'false');
        tabsHost.classList.remove('is-open');
      }
      function syncTriggerLabel() {
        if (!triggerLabel) return;
        const active = tabsHost.querySelector('.subtab[aria-current="true"]');
        if (active) triggerLabel.textContent = active.textContent.trim();
      }
      if (trigger) {
        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          const open = trigger.getAttribute('aria-expanded') === 'true';
          trigger.setAttribute('aria-expanded', String(!open));
          tabsHost.classList.toggle('is-open', !open);
        });
        document.addEventListener('click', (e) => {
          if (!trigger.contains(e.target) && !tabsHost.contains(e.target)) closeTrigger();
        });
        syncTriggerLabel();
      }

      tabsHost.addEventListener('click', (e) => {
        const btn = e.target.closest('.subtab[data-bucket]');
        if (!btn) return;
        e.preventDefault();
        // Click sur la cat déjà active : on ferme juste le trigger.
        if (btn.dataset.bucket === activeBucket) {
          closeTrigger();
          return;
        }
        activeBucket = btn.dataset.bucket;
        activeSub = null; // reset quand on change de bucket
        tabsHost.querySelectorAll('.subtab').forEach(b => {
          if (b === btn) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
        renderProfiles();
        renderChips();
        renderTestimonials();
        syncTriggerLabel();
        closeTrigger();
        // Scroll vers le haut du panel-body : si l'utilisateur était
        // scrollé deep dans Tech et qu'il bascule sur Data, il faut
        // remettre le contenu au début (sinon on tombe en plein milieu
        // d'une nouvelle liste et on ne voit pas le menu / les chips).
        requestAnimationFrame(() => {
          const panelBody = document.querySelector('.panel-body');
          if (!panelBody) return;
          const headerOffset = 110;
          const top = panelBody.getBoundingClientRect().top + window.scrollY - headerOffset;
          window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
        });
      });

      Promise.all([
        fetch('metiers.json').then(r => r.json()),
        fetch('candidates.json').then(r => r.json())
      ]).then(([m, c]) => {
        metiers = m;
        candidates = c;
        renderProfiles();
        renderChips();
        renderTestimonials();
      }).catch(err => {
        console.error('Failed to load data:', err);
        profilesArea.innerHTML = '<div class="empty-state">Impossible de charger les profils pour le moment. Réessayez plus tard.</div>';
        container.innerHTML = '';
      });
    })();
  </script>
</body>
</html>
