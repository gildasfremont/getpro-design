<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GetPro — Métiers</title>
<meta name="description" content="+2000 talents recrutés sur Tech, Product, Data, Sales, Marketing, Ops et C-level. La cartographie des profils que GetPro chasse au quotidien." />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<meta property="og:title" content="GetPro — Métiers" />
<meta property="og:description" content="+2000 talents recrutés sur Tech, Product, Data, Sales, Marketing, Ops et C-level. La cartographie des profils que GetPro chasse au quotidien." />
<meta property="og:type" content="website" />
<meta property="og:locale" content="fr_FR" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="styles.css" />
<style>
  .solutions {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding-bottom: var(--gap-section);
  }
  /* .solutions-head + .solutions-title-row : règles globales dans
     styles.css (cf. solutions.html / solutions-renfort.html). */

  .panel {
    background: var(--white);
    padding: var(--pad-card-y) var(--pad-card-x);
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 3.4vw, 50px);
  }

  /* Col 2 du panel-body : view-tabs (Postes / Retour d'expérience) en
     haut, et le contenu de la vue active en dessous. Le filtrage par
     catégorie (col 1) s'applique aux deux vues. */
  .content-col {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .view-tabs {
    display: flex;
    gap: clamp(20px, 3vw, 50px);
    border-bottom: 1px solid var(--line);
    margin-bottom: clamp(28px, 3.4vw, 50px);
  }
  .view-tab {
    padding: clamp(14px, 1.4vw, 20px) 0;
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.25;
    background: none;
    border: none;
    color: inherit;
    font-family: inherit;
    cursor: pointer;
    position: relative;
    white-space: nowrap;
  }
  .view-tab[aria-current="true"]::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--ink);
  }
  .view-body[hidden] { display: none; }

  /* Vue "Postes" : 2 cols — categories | profils. */
  .panel-body {
    display: grid;
    grid-template-columns: minmax(120px, 0.5fr) minmax(0, 1fr);
    gap: clamp(28px, 4vw, 60px);
    align-items: start;
  }
  /* Vue "Retour d'expérience" : les témoignages prennent toute la
     largeur du panel, capés à --measure pour la lisibilité. */
  .view-rdx .testimonials {
    max-width: var(--measure);
  }
  /* Col 1 du panel-body : la liste des catégories (subtabs) avec le
     rating Trustpilot dessous. Sticky pour rester visible pendant
     que l'utilisateur scrolle la colonne de droite (postes ou
     témoignages). top: ~100px pour laisser passer la nav sticky
     au-dessus. align-self: start pour ne pas s'étirer sur toute la
     hauteur du grid (sinon sticky n'a rien à faire). */
  .categories-col {
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 3vw, 44px);
    position: -webkit-sticky;
    position: sticky;
    top: clamp(80px, 9vw, 110px);
    align-self: start;
  }
  .subtabs {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1vw, 14px);
  }
  .subtab {
    padding: 0;
    font-size: var(--fs-body);
    line-height: 1.4;
    cursor: pointer;
    background: none;
    border: none;
    color: inherit;
    font-family: inherit;
    text-align: left;
    display: inline-block;
    width: max-content;
  }
  .subtab[aria-current="true"] {
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  /* Sous-catégories indentées (Tech > Software/IA/Hardware,
     Product > Designer/PM/Project). */
  .subtab-sub {
    padding-left: clamp(16px, 1.4vw, 24px);
    opacity: 0.85;
  }
  .subtab-sub[aria-current="true"] { opacity: 1; }

  /* Profiles : single column flat list */
  .profiles-area {
    font-size: var(--fs-body);
    line-height: 1.4;
    display: flex;
    flex-direction: column;
  }
  .profiles-block {
    display: flex;
    flex-direction: column;
    gap: clamp(2px, 0.3vw, 6px);
    margin-bottom: clamp(20px, 2vw, 30px);
  }
  .profiles-block:last-child { margin-bottom: 0; }
  .profiles-sub-label {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: clamp(11px, 1vw, 14px);
    opacity: 0.55;
    margin-bottom: clamp(2px, 0.3vw, 6px);
  }
  .profile {
    color: inherit;
    display: block;
    padding: clamp(3px, 0.4vw, 5px) 0;
  }

  .empty-state {
    padding: 40px 0;
    color: var(--ink);
    opacity: 0.6;
    font-size: var(--fs-body);
  }

  /* Testimonials : right column inside the panel */
  .testimonials {
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 3vw, 44px);
  }

  .testimonial-card {
    display: flex;
    flex-direction: column;
    gap: clamp(16px, 1.8vw, 24px);
  }

  .testimonial-quote {
    font-size: var(--fs-body);
    line-height: var(--lh-body);
    max-width: var(--measure);
  }

  .testimonial-author {
    display: grid;
    grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
    grid-template-areas: "meta logo";
    align-items: center;
    gap: clamp(16px, 2vw, 30px);
  }
  .author-logo {
    grid-area: logo;
    justify-self: start;
    /* Même contrainte que .row-logo dans clients.html : hauteur fixe modeste,
       largeur auto, contain → tous les logos plafonnent à la même hauteur. */
    height: clamp(20px, 2vw, 28px);
    width: auto;
    max-width: 100%;
    object-fit: contain;
    object-position: left center;
  }
  .author-name-fallback {
    grid-area: logo;
    justify-self: start;
    font-size: var(--fs-body);
    line-height: 1.3;
    opacity: 0.6;
  }
  .author-meta { grid-area: meta; display: flex; flex-direction: column; min-width: 0; }
  .author-meta .name { font-size: var(--fs-body); line-height: 1.3; }
  .author-meta .role { font-size: var(--fs-body); line-height: 1.3; opacity: 0.7; }

  @media (max-width: 800px) {
    .panel-title { max-width: none; }
    /* .solutions-title-row : on laisse le flex-wrap global gérer le
       passage à la ligne — les autres pages Solutions/Renfort font
       pareil pour rester cohérent à toutes les tailles. */
    .panel-body { grid-template-columns: 1fr; }
    .subtabs { flex-direction: row; flex-wrap: wrap; gap: 12px 24px; }
  }
</style>
</head>
<body>
  <main class="home">

    <header class="header section" data-nav></header>

    <section class="solutions section">
      <div class="solutions-head">
        <div class="solutions-title-row">
          <h1 class="page-title">Solutions</h1>
          <nav class="tabs-2" aria-label="Solutions">
            <a class="tab-2" href="solutions.html">Chasse</a>
            <a class="tab-2" href="solutions-renfort.html">Renfort RH</a>
            <a class="tab-2" href="solutions-profils.html" aria-current="page">Métiers</a>
          </nav>
        </div>
      </div>

      <div class="panel">
        <h2 class="panel-title">+2000 talents récrutés sur toute la chaine de valeur d'innovation</h2>

        <div class="panel-body">
          <div class="categories-col">
            <div class="subtabs" role="tablist" id="bucket-tabs">
              <button class="subtab" role="tab" data-bucket="tech" aria-current="true">Tech</button>
              <button class="subtab subtab-sub" role="tab" data-bucket="tech" data-sub="software">Software</button>
              <button class="subtab subtab-sub" role="tab" data-bucket="tech" data-sub="ia">IA</button>
              <button class="subtab subtab-sub" role="tab" data-bucket="tech" data-sub="hardware">Hardware</button>
              <button class="subtab" role="tab" data-bucket="product">Product</button>
              <button class="subtab subtab-sub" role="tab" data-bucket="product" data-sub="designer">Designer</button>
              <button class="subtab subtab-sub" role="tab" data-bucket="product" data-sub="pm">PM</button>
              <button class="subtab subtab-sub" role="tab" data-bucket="product" data-sub="project">Project</button>
              <button class="subtab" role="tab" data-bucket="data">Data</button>
              <button class="subtab" role="tab" data-bucket="sales">Sales &amp; Customer</button>
              <button class="subtab" role="tab" data-bucket="marketing">Marketing</button>
              <button class="subtab" role="tab" data-bucket="ops">Ops. &amp; Admin</button>
              <button class="subtab" role="tab" data-bucket="hr">HR</button>
              <button class="subtab" role="tab" data-bucket="c-level">C-level</button>
            </div>
            <div class="rating">
              <img src="assets/trustpilot.svg" alt="Trustpilot" class="rating-logo" />
              <span class="rating-stars">5 ★★★★★</span>
            </div>
          </div>

          <div class="content-col">
            <div class="view-tabs" role="tablist" aria-label="Vue Postes / Retour d'expérience">
              <button class="view-tab" role="tab" data-view="postes" aria-current="true">Postes</button>
              <button class="view-tab" role="tab" data-view="rdx">Retour d'expérience</button>
            </div>

            <div class="view-body" data-view="postes">
              <div class="profiles-area" id="profiles-area"></div>
            </div>

            <div class="view-body view-rdx" data-view="rdx" hidden>
              <div class="testimonials" id="candidate-testimonials"></div>
            </div>
          </div>
        </div>
      </div>

    </section>

    <footer class="site-footer" data-footer></footer>

  </main>
  <script src="partials.js" defer></script>
  <script>
    (function() {
      const tabsHost = document.getElementById('bucket-tabs');
      const profilesArea = document.getElementById('profiles-area');
      const container = document.getElementById('candidate-testimonials');
      const escape = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

      // View tabs (Postes / Retour d'expérience) : swap des deux blocs
      // .view-body[data-view="postes"] et [data-view="rdx"].
      const viewTabsHost = document.querySelector('.view-tabs');
      if (viewTabsHost) {
        viewTabsHost.addEventListener('click', (e) => {
          const btn = e.target.closest('.view-tab[data-view]');
          if (!btn) return;
          const target = btn.dataset.view;
          viewTabsHost.querySelectorAll('.view-tab').forEach(b => {
            if (b === btn) b.setAttribute('aria-current', 'true');
            else b.removeAttribute('aria-current');
          });
          document.querySelectorAll('.view-body[data-view]').forEach(v => {
            if (v.dataset.view === target) v.removeAttribute('hidden');
            else v.setAttribute('hidden', '');
          });
        });
      }

      let metiers = {};
      let candidates = [];
      let activeBucket = 'tech';
      let activeSub = null;

      function renderProfiles() {
        const data = metiers[activeBucket];
        if (!data) return;

        // Si une sous-catégorie est sélectionnée, on n'affiche que ce
        // sous-bloc.
        if (activeSub && data.sub && data.sub[activeSub]) {
          const s = data.sub[activeSub];
          const list = s.postes.map(p => `<span class="profile">${escape(p.name)}</span>`).join('');
          profilesArea.innerHTML = `<div class="profiles-block">
            <div class="profiles-sub-label">${escape(s.label)}</div>
            ${list}
          </div>`;
          return;
        }

        // Bucket avec sous-catégories mais pas de sub actif : on affiche
        // tous les sous-blocs empilés.
        if (data.sub) {
          const subs = Object.values(data.sub).filter(s => s.postes.length > 0);
          profilesArea.innerHTML = subs.map(s => {
            const list = s.postes.map(p => `<span class="profile">${escape(p.name)}</span>`).join('');
            return `<div class="profiles-block">
              <div class="profiles-sub-label">${escape(s.label)}</div>
              ${list}
            </div>`;
          }).join('');
          return;
        }

        // Flat bucket : single column, plain list
        const postes = data.postes;
        profilesArea.innerHTML = `<div class="profiles-block">${
          postes.map(p => `<span class="profile">${escape(p.name)}</span>`).join('')
        }</div>`;
      }

      function filteredCandidates() {
        return candidates.filter(c => {
          if (c.bucket !== activeBucket) return false;
          if (activeSub && c.bucket_sub !== activeSub) return false;
          return true;
        });
      }

      function renderTestimonials() {
        const list = filteredCandidates();
        if (list.length === 0) {
          container.innerHTML = `<div class="empty-state">Aucun témoignage candidat dans cette catégorie pour le moment.</div>`;
          return;
        }
        container.innerHTML = list.map((c) => {
          const role = c.poste_canonique || c.intitule_original || 'Recruté';
          const logoOrName = c.has_logo
            ? `<img class="author-logo" src="assets/${c.company_slug}.svg" alt="${escape(c.company_name)}" />`
            : `<span class="author-name-fallback">${escape(c.company_name)}</span>`;
          return `
            <article class="testimonial-card">
              <p class="testimonial-quote">“${escape(c.text)}”</p>
              <div class="testimonial-author">
                ${logoOrName}
                <div class="author-meta">
                  <div class="name">${escape(c.consumer_name)}</div>
                  <div class="role">${escape(role)}</div>
                </div>
              </div>
            </article>`;
        }).join('');
      }

      tabsHost.addEventListener('click', (e) => {
        const btn = e.target.closest('.subtab[data-bucket]');
        if (!btn) return;
        e.preventDefault();
        activeBucket = btn.dataset.bucket;
        // data-sub présent → sous-catégorie active ; absent → reset.
        activeSub = btn.dataset.sub || null;
        tabsHost.querySelectorAll('.subtab').forEach(b => {
          if (b === btn) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
        renderProfiles();
        renderTestimonials();
      });

      Promise.all([
        fetch('metiers.json').then(r => r.json()),
        fetch('candidates.json').then(r => r.json())
      ]).then(([m, c]) => {
        metiers = m;
        candidates = c;
        renderProfiles();
        renderTestimonials();
      }).catch(err => {
        console.error('Failed to load data:', err);
        profilesArea.innerHTML = '<div class="empty-state">Impossible de charger les profils pour le moment. Réessayez plus tard.</div>';
        container.innerHTML = '';
      });
    })();
  </script>
</body>
</html>
