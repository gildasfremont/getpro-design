<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GetPro Clients</title>
<meta name="description" content="Plus de 200 entreprises accompagnées depuis 2015 : Mistral AI, Lucca, Electra, Filigran, Japhy, et beaucoup d'autres scale-ups en hypercroissance." />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<meta property="og:title" content="GetPro Clients" />
<meta property="og:description" content="Plus de 200 entreprises accompagnées depuis 2015 : Mistral AI, Lucca, Electra, Filigran, Japhy, et beaucoup d'autres scale-ups en hypercroissance." />
<meta property="og:type" content="website" />
<meta property="og:locale" content="fr_FR" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="styles.css" />
<style>
  .clients {
    display: flex;
    flex-direction: column;
    padding-bottom: var(--gap-section);
  }
  .clients {
    /* Aligné sur var(--pad-card-x) (Solutions panel) la box blanche
       respire pareil que sur les autres pages, au détriment de la
       largeur de la preview de témoignage. */
    --clients-pad-x: var(--pad-card-x);
  }
  .clients-head {
    margin-bottom: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 1.4vw, 20px);
  }
  /* flex-end aligne le bas du logo Trustfolio (visuellement en bas du
     rating grâce à .rating { flex-direction: column-reverse }) sur la
     baseline du h1 "Clients". Les étoiles passent visuellement au-
     dessus du logo, sans changer le DOM order. */
  .clients-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: clamp(20px, 3vw, 50px);
  }

  /* Search bar above the panel.
     Grid 2 cols : col 1 = exactement la padding-x du panel, col 2 = input.
     L'icone se cale au bout de col 1, juste avant l'input ; l'input
     démarre au bord interne du panel → aligné avec la colonne "nom"
     de la liste en dessous. */
  .clients-search {
    display: grid;
    grid-template-columns: var(--clients-pad-x) 1fr;
    align-items: center;
    padding: 14px 0;
  }
  .clients-search input {
    background: none;
    border: none;
    outline: none;
    color: inherit;
    font-family: inherit;
    font-size: var(--fs-body);
    line-height: 1.25;
    padding: 0;
    min-width: 0;
  }
  .clients-search input::placeholder {
    color: var(--ink);
    opacity: 0.4;
  }
  /* Hide the native search clear button (Webkit) */
  .clients-search input[type="search"]::-webkit-search-cancel-button,
  .clients-search input[type="search"]::-webkit-search-decoration {
    -webkit-appearance: none;
    appearance: none;
  }

  /* Leading icon : loupe by default, replaced by × once user types.
     Position en col 1 du grid, alignée à droite avec un peu de gap
     pour qu'elle finisse juste avant le bord interne du panel. */
  .search-icon {
    justify-self: end;
    margin-right: clamp(8px, 1vw, 14px);
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    cursor: default;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 0;
    opacity: 0.55;
    transition: opacity 0.15s ease;
  }
  .search-icon svg {
    width: clamp(16px, 1.4vw, 20px);
    height: clamp(16px, 1.4vw, 20px);
    display: block;
  }
  .search-icon .icon-clear { display: none; }
  /* Once the input has any value, swap loupe → cross + button is clickable */
  .clients-search:has(input:not(:placeholder-shown)) .search-icon {
    cursor: pointer;
    opacity: 1;
  }
  .clients-search:has(input:not(:placeholder-shown)) .icon-loupe { display: none; }
  .clients-search:has(input:not(:placeholder-shown)) .icon-clear { display: block; }

  /* Panel : just a card holding the list même padding que les
     panels des autres pages (Solutions, etc.) pour respirer pareil. */
  .clients-panel {
    background: var(--white);
    padding: var(--pad-card-y) var(--clients-pad-x);
  }

  /* "Et aussi" : titre intermédiaire entre la liste avec témoignages
     et la liste simple en 2 colonnes. */
  .clients-rest-title {
    margin-top: clamp(40px, 5vw, 70px);
    margin-bottom: clamp(20px, 2vw, 32px);
    font-size: clamp(20px, 2vw, 28px);
    line-height: 1.25;
    font-weight: 400;
    opacity: 0.6;
  }
  .clients-rest-title[hidden] { display: none; }

  /* Liste simple sans témoignages : grille 4-col de logos d'abord,
     puis les noms (clients sans logo) à la fin. */
  .clients-list-plain {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    column-gap: clamp(20px, 3vw, 50px);
    row-gap: clamp(16px, 2vw, 28px);
    font-size: clamp(14px, 1.2vw, 18px);
    line-height: 1.25;
    align-items: center;
  }
  .clients-list-plain[hidden] { display: none; }
  .clients-list-plain li {
    color: inherit;
    min-width: 0;
    height: clamp(24px, 2.6vw, 34px);
    display: flex;
    align-items: center;
  }
  .clients-list-plain li.plain-logo img {
    display: block;
    height: 100%;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    object-position: left center;
  }
  .clients-list-plain li.plain-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @media (max-width: 800px) {
    .clients-list-plain { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 500px) {
    .clients-list-plain { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* The content grid : parent grid définit 2 colonnes (info | témoignage),
     chaque <li.row> est un subgrid item qui hérite de ces tracks. La col 1
     "info" empile nom + logo sous le nom (cf .row-info plus bas). */
  .clients-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 3fr);
    /* Gouttière colonne plus large pour aérer la frontière noms/témoignages. */
    column-gap: clamp(40px, 6vw, 110px);
    /* Espacement entre boîtes nettement augmenté. */
    row-gap: clamp(28px, 3vw, 48px);
    /* Une seule taille de typo pour toute la zone : nom, preview, témoignage */
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.25;
  }
  .row {
    display: grid;
    grid-template-columns: subgrid;
    grid-column: 1 / -1;
    align-items: start;
    position: relative;
    transition: opacity 0.18s ease;
  }
  .row.clickable { cursor: pointer; }

  /* When a row is active (testimonial open), grey out all the other rows.
     Any row being hovered (or the active one itself) returns to full opacity. */
  .clients-list:has(.row.active) .row { opacity: 0.3; }
  .clients-list:has(.row.active) .row.active,
  .clients-list:has(.row.active) .row:hover { opacity: 1; }

  /* Col 1 : logo au-dessus, nom en dessous (en plus petit, rôle de label). */
  .row-info {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.2vw, 18px);
    min-width: 0;
  }
  .clients-list a.name-link {
    display: block;
    color: inherit;
    pointer-events: none;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    /* Plus petit que le témoignage à droite : il sert de légende sous
       le logo, le logo est l'identifiant principal de la marque. */
    font-size: clamp(15px, 1.4vw, 20px);
    line-height: 1.3;
  }
  /* Plus de soulignement sur les noms cliquables — le ton sobre suffit,
     le hover/curseur signalent l'interactivité. */

  /* Logo sous le nom (taille discrète, pas le bloc principal). */
  .logo-cell {
    display: block;
    min-width: 0;
  }
  .row-logo {
    display: block;
    height: clamp(20px, 2vw, 28px);
    width: auto;
    max-width: clamp(100px, 11vw, 150px);
    object-fit: contain;
    object-position: left center;
  }

  /* Col 2 : preview 2 lignes + (absolute) témoignage déployé */
  .row-tm {
    display: block;
    position: relative;
    min-width: 0;
  }
  .tm-line {
    display: -webkit-box;
    -webkit-line-clamp: 2;
            line-clamp: 2;
    -webkit-box-orient: vertical;
    opacity: 0.4;
    overflow: hidden;
    /* line-height un poil resserré pour que 2 lignes s'alignent visuellement
       avec le bloc nom+logo de gauche. */
    line-height: 1.3;
  }

  .tm-full {
    display: none;
    position: absolute;
    /* Top à 0 + padding-top à 0 : la 1ʳᵉ ligne du témoignage déployé
       commence pile à la baseline du preview (.tm-line, gardé visible
       en visibility:hidden pour réserver la hauteur). Latéralement et
       en bas, la bulle blanche déborde sa colonne pour respirer. */
    top: 0;
    left: clamp(-40px, -3vw, -24px);
    right: clamp(-40px, -3vw, -24px);
    z-index: 2;
    background: var(--white);
    padding: 0 clamp(32px, 4vw, 64px) clamp(48px, 6vw, 88px);
    flex-direction: column;
    gap: clamp(24px, 2.6vw, 40px);
  }
  .row.active .tm-full { display: flex; }
  /* visibility: hidden conserve la hauteur (2 lignes maintenant) du preview,
     ce qui donne à .row-tm un baseline stable → la 1ʳᵉ ligne du témoignage
     déployé s'aligne avec le nom du client. */
  .row.active .tm-line { visibility: hidden; }

  /* margin: 0 OBLIGATOIRE sur la quote : le margin-block default des
     <p> (~1em) décalerait la 1ʳᵉ ligne du témoignage déployé vers le
     bas, alors qu'on veut un alignement strict avec la baseline du
     preview .tm-line gardé en place via visibility: hidden. */
  .testimonial-quote {
    margin: 0;
    line-height: 1.3;
  }
  .testimonial-author .name { line-height: 1.3; }
  .testimonial-author .role { line-height: 1.3; }

  /* Footer of the testimonial : just the website (or defunct status) */
  .testimonial-footer {
    display: flex;
    align-items: center;
    gap: clamp(20px, 3vw, 40px);
    flex-wrap: wrap;
  }
  .testimonial-footer .website {
    line-height: 1.3;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .testimonial-footer .defunct {
    line-height: 1.3;
    opacity: 0.6;
    font-style: italic;
  }

  /* Page header : "Clients" + Trustfolio en face, sur la même ligne à
     toutes les largeurs. Le rating reste petit, ça tient même en
     mobile à côté du h1. */
  .clients-title-row { gap: clamp(12px, 2vw, 30px); }
  @media (max-width: 800px) {
    .ratings-row { flex-wrap: wrap; }
  }

  /* Phone : le témoignage actif wrap autour du nom (1ʳᵉ ligne à droite,
     puis suivantes sous le nom). Float sur le name-link, .tm-full bascule
     en block. La grille 2 cols (info | témoignage) tient jusqu'à 600px :
     en dessous on passe en pleine largeur avec le wrap autour du nom. */
  @media (max-width: 600px) {
    .clients-list {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      row-gap: clamp(20px, 2.4vw, 32px);
    }
    .row { grid-column: 1 / -1; display: block; }
    .row-info { display: contents; }
    .logo-cell { display: none; }
    .row.active .tm-line { display: none; }
    .tm-full { position: relative; }

    .clients-list a.name-link {
      float: left;
      margin-right: clamp(8px, 2vw, 16px);
    }
    .row.active .tm-full {
      display: block;
      background: transparent;
    }
    .row.active .tm-full > * + * {
      margin-top: clamp(18px, 2vw, 30px);
    }

    /* Panel "full-bleed" : la box blanche prend toute la largeur du
       viewport. On annule la gouttière de .section via une marge
       négative égale à --pad-x, et on aligne le padding interne du
       panel sur --pad-x → le contenu interne (noms, témoignages)
       reste aligné avec le titre Clients et les ratings au-dessus. */
    .clients-panel {
      margin-inline: calc(var(--pad-x) * -1);
      padding-inline: var(--pad-x);
    }
    /* Search bar : on inverse le pattern desktop (icone à gauche,
       input à droite). En mobile, l'input prend la largeur, l'icone
       part au bout de ligne, alignée avec le bord droit de la
       section. La grille passe à 1fr auto et on utilise `order` pour
       inverser visuellement (DOM order : icone puis input ; visual :
       input puis icone). */
    .clients-search {
      grid-template-columns: 1fr auto;
    }
    .clients-search input { order: 1; }
    .search-icon {
      order: 2;
      margin-right: 0;
    }
  }
</style>
</head>
<body>
  <main class="home">

    <header class="header section" data-nav></header>

    <section class="clients section">
      <div class="clients-head">
        <div class="clients-title-row">
          <h1 class="page-title">Clients</h1>
          <div class="ratings-row">
            <div class="rating">
              <img src="assets/trustfolio.svg" alt="Trustfolio" class="rating-logo" />
              <span class="rating-stars">4,8 ★★★★★</span>
            </div>
          </div>
        </div>
        <div class="clients-search">
          <button type="button" class="search-icon" id="search-icon" aria-label="Effacer la recherche">
            <svg class="icon-loupe" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <circle cx="9" cy="9" r="6"></circle>
              <line x1="13.5" y1="13.5" x2="17.5" y2="17.5"></line>
            </svg>
            <svg class="icon-clear" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <line x1="5" y1="5" x2="15" y2="15"></line>
              <line x1="5" y1="15" x2="15" y2="5"></line>
            </svg>
          </button>
          <input type="search" id="clients-search" placeholder="Rechercher dans la liste…" autocomplete="off" />
        </div>
      </div>

      <div class="clients-panel">
        <!-- 1. Clients avec témoignage : liste riche logo + quote -->
        <ul class="clients-list" id="clients-names" role="list"></ul>

        <!-- 2. Reste des clients : liste 2-col simple, juste les noms -->
        <h2 class="clients-rest-title" id="clients-rest-title" hidden>Et aussi</h2>
        <ul class="clients-list-plain" id="clients-rest" role="list" hidden></ul>
      </div>
    </section>

    <footer class="site-footer" data-footer></footer>

  </main>
  <script src="partials.js" defer></script>
  <script>
    (function() {
      const searchInput = document.getElementById('clients-search');
      const namesHost = document.getElementById('clients-names');
      const escape = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const norm = (s) => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

      // Cool order : the array order IS the display order pas d'alpha entre eux.
      // Le reste des clients (non listés ici) tombe en queue, en ordre alpha.
      const COOL_ORDER = [
        // IA hot
        'mistral-ai', 'eleven-labs', 'dust', 'filigran', 'kili-technology',
        'mindee', 'harfanglab', 'sipearl', 'unifai', 'autrice-ai',
        'webyn-ai', 'ai-cargo-foundation',
        // Réseaux sociaux & marques avec présence média / consumer
        'yubo', 'voggt', 'voodoo', 'kisskissbankbank', 'joko',
        'cheerz', 'lunii', 'mwm', 'madbox', 'kabeen', 'ron-dorff',
        'lemlist', 'onefinestay', 'splio',
        // Scale-ups B+ connues / grosses levées
        'electra', 'contentsquare', 'doctrine', 'evaneos', 'jobteaser',
        'pigment', 'lucca', 'partoo', 'getaround', 'matera', 'agicap',
        // Grandes marques françaises
        'blablacar', 'carrefour', 'carrefour-2', 'decathlon', 'jcdecaux',
        'canal-plus', 'rakuten', 'rakuten-dx', 'total', 'porsche-france',
        'edf-enr', 'oscaro', 'prestashop',
        // Tech identifiable B2B
        'flaire', 'manomano', 'libeo', 'leetchi', 'kard', 'foodles',
        'spiko', 'cybelangel', 'twicpics', 'jus-mundi', 'mytraffic',
      ];
      const RANK = new Map(COOL_ORDER.map((slug, i) => [slug, i]));
      const rankOf = (slug) => RANK.has(slug) ? RANK.get(slug) : Infinity;

      const sortClients = (list) => list.slice().sort((a, b) => {
        const ra = rankOf(a.slug);
        const rb = rankOf(b.slug);
        if (ra !== rb) return ra - rb;
        // Tie-break (only fires for the unranked rest) : alpha
        return a.name.localeCompare(b.name, 'fr', { sensitivity: 'base' });
      });

      let clients = [];
      let sorted = [];
      let searchQuery = '';
      let activeSlug = null;

      function filteredClients() {
        if (!searchQuery) return sorted;
        const q = norm(searchQuery);
        // Match sur le name principal et sur les aliases (anciens noms,
        // marques alternatives, ex: Pono → Covalt). Les aliases ne
        // s'affichent pas dans la liste, ils servent juste à retrouver
        // l'entrée par un nom familier.
        return sorted.filter(c => {
          if (norm(c.name).includes(q)) return true;
          if (Array.isArray(c.aliases) && c.aliases.some(a => norm(a).includes(q))) return true;
          return false;
        });
      }

      function rowHTML(c) {
        const cls = c.has_testimonial ? 'has-tm' : 'plain';
        const clickableCls = c.has_testimonial ? ' clickable' : '';
        const activeCls = c.slug === activeSlug ? ' active' : '';
        // Pas de span vide quand pas de logo : avec le layout en flex
        // column (logo au-dessus du nom), un span vide créerait un gap
        // fantôme au-dessus du nom — on n'émet rien.
        const logoCell = c.has_logo
          ? `<span class="logo-cell"><img class="row-logo" src="assets/${c.slug}.svg" alt="" loading="lazy" /></span>`
          : '';

        let tmCell = '<span class="row-tm"></span>';
        if (c.has_testimonial) {
          const websiteOrDefunct = c.status_label
            ? `<span class="defunct">${escape(c.status_label)}</span>`
            : c.domaine
              ? `<a class="website" href="https://${escape(c.domaine.replace(/^https?:\/\//,''))}" target="_blank" rel="noopener">${escape(c.domaine.replace(/^https?:\/\//,''))} ↗</a>`
              : '';
          tmCell = `<span class="row-tm">
            <span class="tm-line">"${escape(c.verbatim || '')}"</span>
            <div class="tm-full">
              <p class="testimonial-quote">"${escape(c.verbatim || '')}"</p>
              <div class="testimonial-author">
                <div class="name">${escape(c.contact_name || '')}</div>
                <div class="role">${escape(c.contact_role || '')}</div>
              </div>
              ${websiteOrDefunct ? `<div class="testimonial-footer">${websiteOrDefunct}</div>` : ''}
            </div>
          </span>`;
        }

        // Col 1 = .row-info empile le logo (au-dessus, identifiant
        // principal) et le nom (en dessous, plus petit, rôle de légende).
        // Col 2 = .row-tm preview + (active) testimonial déployé.
        return `<li class="row${clickableCls}${activeCls}" data-slug="${c.slug}">
          <div class="row-info">
            ${logoCell}
            <a href="#" class="name-link ${cls}" data-slug="${c.slug}">${escape(c.name)}</a>
          </div>
          ${tmCell}
        </li>`;
      }

      const restHost = document.getElementById('clients-rest');
      const restTitle = document.getElementById('clients-rest-title');

      function renderList() {
        const list = filteredClients();
        // Split : clients avec témoignage en haut (liste riche),
        // les autres en bas (logos d'abord, noms sans logo à la fin).
        const withTm = list.filter(c => c.has_testimonial);
        const restWithLogo = list.filter(c => !c.has_testimonial && c.has_logo);
        const restNoLogo   = list.filter(c => !c.has_testimonial && !c.has_logo);

        namesHost.innerHTML = withTm.map(rowHTML).join('');

        const logoCells = restWithLogo.map(c =>
          `<li class="plain-logo" data-slug="${c.slug}"><img src="assets/${c.slug}.svg" alt="${escape(c.name)}" loading="lazy" /></li>`
        );
        const nameCells = restNoLogo.map(c =>
          `<li class="plain-name" data-slug="${c.slug}">${escape(c.name)}</li>`
        );
        restHost.innerHTML = [...logoCells, ...nameCells].join('');

        // Masque la 2e section et son titre s'il n'y a personne
        // (ex : recherche qui ne match que des clients avec témoignage).
        if (restWithLogo.length + restNoLogo.length === 0) {
          restHost.setAttribute('hidden', '');
          restTitle.setAttribute('hidden', '');
        } else {
          restHost.removeAttribute('hidden');
          restTitle.removeAttribute('hidden');
        }
      }

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        activeSlug = null;
        renderList();
      });

      // Cross icon clears the input (only when input has content)
      const searchIconBtn = document.getElementById('search-icon');
      searchIconBtn.addEventListener('click', () => {
        if (!searchInput.value) return;
        searchInput.value = '';
        searchQuery = '';
        activeSlug = null;
        renderList();
        searchInput.focus();
      });

      namesHost.addEventListener('click', (e) => {
        // Let the website link in the open testimonial work as a real link
        if (e.target.closest('.tm-full a.website')) return;
        const li = e.target.closest('li.row.clickable');
        if (!li) return;
        e.preventDefault();
        const slug = li.dataset.slug;
        activeSlug = (activeSlug === slug) ? null : slug;
        renderList();
      });

      fetch('clients.json', { cache: 'no-store' }).then(r => r.json()).then(data => {
        clients = data;
        sorted = sortClients(data);

        // Deep-link : open the testimonial of the slug in the URL hash (e.g. clients.html#mistral-ai)
        const hash = decodeURIComponent((location.hash || '').replace(/^#/, ''));
        if (hash) {
          const target = clients.find(c => c.slug === hash && c.has_testimonial);
          if (target) activeSlug = target.slug;
        }
        renderList();

        // Scroll the active row into a comfortable viewport position
        if (activeSlug) {
          const li = namesHost.querySelector(`li.row[data-slug="${activeSlug}"]`);
          if (li) {
            const targetY = li.getBoundingClientRect().top + window.scrollY - 80;
            window.scrollTo({ top: Math.max(0, targetY), behavior: 'auto' });
          }
        } else if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
          // Auto-focus the search input on devices with a real keyboard
          // (desktop/laptop). Skipped sur mobile/tablet pour ne pas
          // déclencher le clavier virtuel à l'arrivée sur la page.
          searchInput.focus({ preventScroll: true });
        }
      }).catch(err => {
        console.error('Failed to load clients:', err);
        namesHost.innerHTML = '<li class="empty-state">Impossible de charger la liste pour le moment. Réessayez plus tard.</li>';
      });
    })();
  </script>
</body>
</html>
