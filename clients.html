<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GetPro — Clients</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .clients {
    display: flex;
    flex-direction: column;
    padding-bottom: var(--gap-section);
  }
  .clients-head {
    margin-bottom: clamp(14px, 1.4vw, 20px);
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 1.4vw, 20px);
  }
  .clients-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: clamp(20px, 3vw, 50px);
  }

  /* Panel */
  .clients-panel {
    background: var(--white);
    padding: clamp(28px, 3.4vw, 50px) clamp(20px, 3vw, 50px);
    display: grid;
    grid-template-columns: minmax(200px, 0.9fr) auto minmax(0, 2.5fr);
    gap: clamp(20px, 3vw, 50px);
    align-items: start;
  }
  /* When a testimonial is open, panel switches to: collapsed filters | alphabet | names | testimonial */
  .clients[data-mode="detail"] .clients-panel {
    grid-template-columns: auto auto minmax(0, 1.2fr) minmax(0, 2fr);
  }

  /* ---------- Filters zone ---------- */
  .filters-zone { min-width: 0; }
  .filters-full {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1vw, 14px);
    font-size: var(--fs-body);
    line-height: 1.4;
  }
  .filters-collapsed { display: none; }
  .clients[data-mode="detail"] .filters-full { display: none; }
  .clients[data-mode="detail"] .filters-collapsed { display: flex; }

  .filters-collapsed {
    flex-direction: column;
    gap: clamp(10px, 1vw, 14px);
    align-items: flex-start;
  }
  .filters-collapsed .toggle-btn {
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    font-family: inherit;
    cursor: pointer;
    font-size: var(--fs-menu);
    line-height: 1.2;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-align: left;
    white-space: nowrap;
  }
  .filters-collapsed .chips {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .filters-collapsed .chip {
    padding: 4px 10px;
    border: 1px solid var(--line);
    font-size: clamp(11px, 1vw, 14px);
    line-height: 1.2;
    white-space: nowrap;
  }

  .checkbox {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .checkbox-mark {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--ink);
    flex: none;
    position: relative;
  }
  .checkbox input { display: none; }
  .checkbox input:checked + .checkbox-mark::after {
    content: "";
    position: absolute;
    inset: 3px;
    background: var(--ink);
  }
  .filter-divider {
    height: 1px;
    background: var(--line);
    margin: clamp(6px, 0.7vw, 10px) 0;
  }

  /* ---------- Alphabet ---------- */
  .alphabet {
    display: flex;
    flex-direction: column;
    font-size: clamp(12px, 1vw, 14px);
    line-height: 1.4;
    color: var(--ink);
    opacity: 0.6;
    user-select: none;
  }
  .alphabet a { color: inherit; text-decoration: none; }
  .alphabet a:hover { opacity: 1; }

  /* ---------- Names list (paired with hover-logo) ---------- */
  .clients-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 0.8vw, 12px);
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.25;
  }
  .clients-list li {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: clamp(16px, 2vw, 30px);
  }
  .clients-list a { color: inherit; }
  .clients-list .has-tm {
    text-decoration: underline;
    text-underline-offset: 4px;
    cursor: pointer;
  }
  .clients-list .has-tm::after {
    content: " →";
  }
  .clients-list .plain { cursor: default; pointer-events: none; }
  .clients-list .selected {
    text-decoration-thickness: 2px;
  }
  .row-logo {
    height: clamp(20px, 2vw, 28px);
    width: auto;
    max-width: clamp(80px, 9vw, 130px);
    object-fit: contain;
    object-position: right center;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .clients-list li:hover .row-logo { opacity: 0.6; }

  /* ---------- Testimonial pane (right side, only in detail mode) ---------- */
  .testimonial-pane {
    display: none;
    flex-direction: column;
    gap: clamp(20px, 2.7vw, 40px);
  }
  .clients[data-mode="detail"] .testimonial-pane { display: flex; }

  .testimonial-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
  }
  .testimonial-header h2 {
    font-size: var(--fs-card-title);
    line-height: var(--lh-card-title);
  }
  .testimonial-header .close-btn {
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    font-family: inherit;
    cursor: pointer;
    font-size: var(--fs-menu);
    line-height: 1.2;
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  .testimonial-quote {
    font-size: var(--fs-card-sub);
    line-height: var(--lh-card-sub);
  }
  .testimonial-author .name { font-size: var(--fs-body); line-height: 1.3; }
  .testimonial-author .role { font-size: var(--fs-body); line-height: 1.3; opacity: 0.8; }
  .case-description {
    font-size: var(--fs-body);
    line-height: var(--lh-body);
    opacity: 0.85;
  }

  @media (max-width: 1100px) {
    .clients-panel { grid-template-columns: minmax(180px, 0.8fr) auto minmax(0, 2fr); }
    .clients[data-mode="detail"] .clients-panel { grid-template-columns: auto auto minmax(0, 1fr) minmax(0, 1.6fr); }
  }
  @media (max-width: 800px) {
    .clients-title-row { flex-direction: column; align-items: flex-start; }
    .ratings-row { flex-wrap: wrap; }
    .clients-panel,
    .clients[data-mode="detail"] .clients-panel { grid-template-columns: 1fr; }
    .alphabet { flex-direction: row; flex-wrap: wrap; gap: 4px; }
    .row-logo { display: none; }  /* hide on mobile (no hover) */
  }
</style>
</head>
<body>
  <main class="home">

    <header class="header section" data-nav></header>

    <section class="clients section" data-mode="list">
      <div class="clients-head">
        <div class="clients-title-row">
          <h1 class="page-title">Clients</h1>
          <div class="ratings-row">
            <div class="rating">
              <img src="assets/trustpilot.svg" alt="Trustpilot" class="rating-logo" />
              <span class="rating-stars">5 ★★★★★</span>
            </div>
            <div class="rating">
              <img src="assets/trustfolio.svg" alt="Trustfolio" class="rating-logo" />
              <span class="rating-stars">4,8 ★★★★★</span>
            </div>
            <div class="rating">
              <img src="assets/google.svg" alt="Google" class="rating-logo" />
              <span class="rating-stars">4,3 ★★★★★</span>
            </div>
          </div>
        </div>
      </div>

      <div class="clients-panel">
        <div class="filters-zone">
          <!-- Full filters (list mode) -->
          <div class="filters-full" id="filters">
            <label class="checkbox">
              <input type="checkbox" data-filter="all" checked />
              <span class="checkbox-mark"></span>
              <span>Tout</span>
            </label>
            <label class="checkbox">
              <input type="checkbox" data-filter="testimonial" />
              <span class="checkbox-mark"></span>
              <span>Avec retour d'expérience (69)</span>
            </label>
            <div class="filter-divider" aria-hidden="true"></div>
            <label class="checkbox">
              <input type="checkbox" data-filter="finance" />
              <span class="checkbox-mark"></span>
              <span>Finance &amp; Assurance (50)</span>
            </label>
            <label class="checkbox">
              <input type="checkbox" data-filter="sante" />
              <span class="checkbox-mark"></span>
              <span>Santé (26)</span>
            </label>
            <label class="checkbox">
              <input type="checkbox" data-filter="beaute" />
              <span class="checkbox-mark"></span>
              <span>Beauté (8)</span>
            </label>
            <label class="checkbox">
              <input type="checkbox" data-filter="education" />
              <span class="checkbox-mark"></span>
              <span>Éducation (8)</span>
            </label>
          </div>

          <!-- Collapsed filters (detail mode) -->
          <div class="filters-collapsed">
            <button type="button" class="toggle-btn" id="back-to-filters">← Filtres</button>
            <div class="chips" id="active-chips"></div>
          </div>
        </div>

        <nav class="alphabet" aria-label="Filtre alphabétique">
          <a href="#A">A</a><a href="#B">B</a><a href="#C">C</a><a href="#D">D</a>
          <a href="#E">E</a><a href="#F">F</a><a href="#G">G</a><a href="#H">H</a>
          <a href="#I">I</a><a href="#J">J</a><a href="#K">K</a><a href="#L">L</a>
          <a href="#M">M</a><a href="#N">N</a><a href="#O">O</a><a href="#P">P</a>
          <a href="#Q">Q</a><a href="#R">R</a><a href="#S">S</a><a href="#T">T</a>
          <a href="#U">U</a><a href="#V">V</a><a href="#W">W</a><a href="#X">X</a>
          <a href="#Y">Y</a><a href="#Z">Z</a>
        </nav>

        <ul class="clients-list" id="clients-names" role="list"></ul>

        <div class="testimonial-pane" id="testimonial-pane"></div>
      </div>
    </section>

    <footer class="site-footer" data-footer></footer>

  </main>
  <script src="partials.js" defer></script>
  <script>
    (function() {
      const root = document.querySelector('.clients');
      const filtersHost = document.getElementById('filters');
      const namesHost = document.getElementById('clients-names');
      const testimonialPane = document.getElementById('testimonial-pane');
      const chipsHost = document.getElementById('active-chips');
      const backBtn = document.getElementById('back-to-filters');
      const escape = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

      const FILTER_LABELS = {
        testimonial: "Avec retour d'expérience",
        finance: 'Finance & Assurance',
        sante: 'Santé',
        beaute: 'Beauté',
        education: 'Éducation',
      };

      let clients = [];
      let activeFilters = new Set();
      let activeSlug = null;

      function filteredClients() {
        if (activeFilters.has('testimonial')) {
          return clients.filter(c => c.has_testimonial);
        }
        return clients;
      }

      function renderList() {
        const list = filteredClients();
        namesHost.innerHTML = list.map(c => {
          const isActive = c.slug === activeSlug ? ' selected' : '';
          const cls = c.has_testimonial ? 'has-tm' + isActive : 'plain';
          const logoTag = c.has_logo
            ? `<img class="row-logo" src="assets/${c.slug}.svg" alt="" loading="lazy" />`
            : `<span></span>`;
          return `<li>
            <a href="#" data-slug="${c.slug}" class="${cls}">${escape(c.name)}</a>
            ${logoTag}
          </li>`;
        }).join('');
      }

      function renderChips() {
        const active = [...activeFilters].filter(f => FILTER_LABELS[f]);
        if (active.length === 0) {
          chipsHost.innerHTML = '<span class="chip" style="opacity:0.6">Aucun filtre</span>';
          return;
        }
        chipsHost.innerHTML = active.map(f =>
          `<span class="chip">${FILTER_LABELS[f]}</span>`
        ).join('');
      }

      function renderTestimonial() {
        const c = clients.find(x => x.slug === activeSlug);
        if (!c) return;
        testimonialPane.innerHTML = `
          <div class="testimonial-header">
            <h2>${escape(c.name)}</h2>
            <button type="button" class="close-btn" id="close-testimonial">Fermer ✕</button>
          </div>
          <p class="testimonial-quote">"${escape(c.verbatim || 'Témoignage à venir.')}"</p>
          <div class="testimonial-author">
            <div class="name">${escape(c.contact_name || '')}</div>
            <div class="role">${escape(c.contact_role || '')}</div>
          </div>
          ${c.description ? `<p class="case-description">${escape(c.description)}</p>` : ''}
        `;
        document.getElementById('close-testimonial')
          .addEventListener('click', dismissTestimonial);
      }

      function setMode(mode) {
        root.dataset.mode = mode;
        if (mode === 'detail') {
          renderChips();
          renderTestimonial();
        }
        renderList();
      }

      function dismissTestimonial() {
        activeSlug = null;
        setMode('list');
      }

      // Filter change
      filtersHost.addEventListener('change', (e) => {
        const input = e.target.closest('input[data-filter]');
        if (!input) return;
        const fid = input.dataset.filter;
        if (fid === 'all') {
          if (input.checked) {
            activeFilters.clear();
            filtersHost.querySelectorAll('input[data-filter]').forEach(i => {
              if (i.dataset.filter !== 'all') i.checked = false;
            });
          }
        } else {
          if (input.checked) activeFilters.add(fid);
          else activeFilters.delete(fid);
          const allInput = filtersHost.querySelector('input[data-filter="all"]');
          allInput.checked = activeFilters.size === 0;
        }
        renderList();
      });

      // Click on name → testimonial
      namesHost.addEventListener('click', (e) => {
        const a = e.target.closest('a.has-tm[data-slug]');
        if (!a) return;
        e.preventDefault();
        activeSlug = a.dataset.slug;
        setMode('detail');
      });

      // "← Filtres" — go back to list (filters expanded)
      backBtn.addEventListener('click', dismissTestimonial);

      fetch('clients.json').then(r => r.json()).then(data => {
        clients = data;
        renderList();
      }).catch(err => console.error('Failed to load clients:', err));
    })();
  </script>
</body>
</html>
