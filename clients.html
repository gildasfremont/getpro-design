<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GetPro — Clients</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .clients {
    display: flex;
    flex-direction: column;
    padding-bottom: var(--gap-section);
  }
  .clients-head {
    margin-bottom: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 1.4vw, 20px);
  }
  .clients-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: clamp(20px, 3vw, 50px);
  }

  /* Search bar above the panel (flush, no hairline) */
  .clients-search {
    display: flex;
    align-items: center;
    gap: clamp(12px, 1.4vw, 20px);
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .clients-search input {
    flex: 1 1 0;
    min-width: 0;
    background: none;
    border: none;
    outline: none;
    color: inherit;
    font-family: inherit;
    font-size: var(--fs-body);
    line-height: 1.25;
    padding: 0;
  }
  .clients-search input::placeholder {
    color: var(--ink);
    opacity: 0.4;
  }
  .clients-search .results-count {
    flex: 0 0 auto;
    font-size: var(--fs-body);
    line-height: 1.25;
    opacity: 0.5;
    white-space: nowrap;
  }

  /* Panel : just a card holding the list */
  .clients-panel {
    background: var(--white);
    padding: clamp(28px, 3.4vw, 50px) clamp(20px, 3vw, 50px);
  }

  /* The content grid : 3 cells per row → name | logo | testimonial */
  .clients-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(80px, 9vw, 130px) minmax(0, 3fr);
    column-gap: clamp(20px, 3vw, 50px);
    row-gap: clamp(8px, 0.8vw, 12px);
    align-items: baseline;
    /* Une seule taille de typo pour toute la zone : nom, preview, témoignage */
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.25;
  }
  .row { display: contents; }

  /* Col 1 : name (titre tronqué, pas de retour ligne) */
  .clients-list a.name-link {
    display: block;
    color: inherit;
    pointer-events: none;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .clients-list a.has-tm {
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .row.active a.has-tm { text-decoration-thickness: 2px; }

  /* Col 2 : logo */
  .logo-cell {
    display: block;
    align-self: center;
    min-height: clamp(20px, 2vw, 28px);
  }
  .row-logo {
    display: block;
    height: clamp(20px, 2vw, 28px);
    width: auto;
    max-width: clamp(80px, 9vw, 130px);
    object-fit: contain;
    object-position: left center;
  }

  /* Whole row is clickable when there is a testimonial */
  .row.clickable a.name-link,
  .row.clickable .logo-cell,
  .row.clickable .row-tm { cursor: pointer; }

  /* Col 3 : preview + (absolute) full testimonial */
  .row-tm {
    display: block;
    position: relative;
    min-width: 0;
  }
  .tm-line {
    display: block;
    opacity: 0.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tm-full {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    background: var(--white);
    padding-bottom: clamp(20px, 2.5vw, 40px);
    flex-direction: column;
    gap: clamp(18px, 2vw, 30px);
  }
  .row.active .tm-full { display: flex; }
  .row.active .tm-line { visibility: hidden; }

  .testimonial-quote { line-height: 1.3; }
  .testimonial-author .name { line-height: 1.3; }
  .testimonial-author .role { line-height: 1.3; opacity: 0.7; }

  /* Footer of the testimonial : just the website (or defunct status) */
  .testimonial-footer {
    display: flex;
    align-items: center;
    gap: clamp(20px, 3vw, 40px);
    flex-wrap: wrap;
  }
  .testimonial-footer .website {
    line-height: 1.3;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .testimonial-footer .defunct {
    line-height: 1.3;
    opacity: 0.6;
    font-style: italic;
  }

  @media (max-width: 800px) {
    .clients-title-row { flex-direction: column; align-items: flex-start; }
    .ratings-row { flex-wrap: wrap; }
    .clients-list {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      row-gap: clamp(8px, 0.8vw, 12px);
    }
    .logo-cell { display: none; }
    .tm-full {
      position: relative;
      padding-top: clamp(16px, 2vw, 24px);
      border-top: 1px solid var(--line);
    }
  }
</style>
</head>
<body>
  <main class="home">

    <header class="header section" data-nav></header>

    <section class="clients section">
      <div class="clients-head">
        <div class="clients-title-row">
          <h1 class="page-title">Clients</h1>
          <div class="ratings-row">
            <div class="rating">
              <img src="assets/trustpilot.svg" alt="Trustpilot" class="rating-logo" />
              <span class="rating-stars">5 ★★★★★</span>
            </div>
            <div class="rating">
              <img src="assets/trustfolio.svg" alt="Trustfolio" class="rating-logo" />
              <span class="rating-stars">4,8 ★★★★★</span>
            </div>
            <div class="rating">
              <img src="assets/google.svg" alt="Google" class="rating-logo" />
              <span class="rating-stars">4,3 ★★★★★</span>
            </div>
          </div>
        </div>
        <div class="clients-search">
          <input type="search" id="clients-search" placeholder="Rechercher un client" autocomplete="off" />
          <span class="results-count" id="results-count">381 clients</span>
        </div>
      </div>

      <div class="clients-panel">
        <ul class="clients-list" id="clients-names" role="list"></ul>
      </div>
    </section>

    <footer class="site-footer" data-footer></footer>

  </main>
  <script src="partials.js" defer></script>
  <script>
    (function() {
      const searchInput = document.getElementById('clients-search');
      const resultsCount = document.getElementById('results-count');
      const namesHost = document.getElementById('clients-names');
      const escape = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const norm = (s) => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

      // Cool ranking : lower number = higher in the list. 99 = no special priority.
      // Tier 1 : IA / hottest (Mistral, Eleven Labs, Dust, Filigran, etc.)
      // Tier 2 : grosses levées récentes / scale-ups B+ connues
      // Tier 3 : grandes marques françaises
      // Tier 4 : tech bien identifiée
      const COOL_RANK = {
        // Tier 1 — IA
        'mistral-ai': 1,
        'eleven-labs': 1,
        'dust': 1,
        'filigran': 1,
        'kili-technology': 1,
        'mindee': 1,
        'unifai': 1,
        'autrice-ai': 1,
        'webyn-ai': 1,
        'ai-cargo-foundation': 1,
        'harfanglab': 1,
        'sipearl': 1,
        // Tier 2 — Scale-ups gros tour
        'electra': 2,
        'contentsquare': 2,
        'doctrine': 2,
        'evaneos': 2,
        'jobteaser': 2,
        'pigment': 2,
        'lucca': 2,
        'partoo': 2,
        'getaround': 2,
        'matera': 2,
        'agicap': 2,
        // Tier 3 — Grandes marques
        'blablacar': 3,
        'carrefour': 3,
        'carrefour-2': 3,
        'decathlon': 3,
        'jcdecaux': 3,
        'canal-plus': 3,
        'rakuten': 3,
        'rakuten-dx': 3,
        'prestashop': 3,
        'total': 3,
        'porsche-france': 3,
        'edf-enr': 3,
        'oscaro': 3,
        // Tier 4 — Tech identifiable
        'flaire': 4,
        'lemlist': 4,
        'manomano': 4,
        'libeo': 4,
        'leetchi': 4,
        'kard': 4,
        'foodles': 4,
        'jus-mundi': 4,
        'spiko': 4,
        'mytraffic': 4,
        'aircall': 4,
        'meilisearch': 4,
        'malt': 4,
        'cybelangel': 4,
        'twicpics': 4,
      };

      const sortClients = (list) => list.slice().sort((a, b) => {
        const ra = COOL_RANK[a.slug] || 99;
        const rb = COOL_RANK[b.slug] || 99;
        if (ra !== rb) return ra - rb;
        return a.name.localeCompare(b.name, 'fr', { sensitivity: 'base' });
      });

      let clients = [];
      let sorted = [];
      let searchQuery = '';
      let activeSlug = null;

      function filteredClients() {
        if (!searchQuery) return sorted;
        const q = norm(searchQuery);
        return sorted.filter(c => norm(c.name).includes(q));
      }

      function rowHTML(c) {
        const cls = c.has_testimonial ? 'has-tm' : 'plain';
        const clickableCls = c.has_testimonial ? ' clickable' : '';
        const activeCls = c.slug === activeSlug ? ' active' : '';
        const logoCell = c.has_logo
          ? `<span class="logo-cell"><img class="row-logo" src="assets/${c.slug}.svg" alt="" loading="lazy" /></span>`
          : '<span class="logo-cell"></span>';

        let tmCell = '<span class="row-tm"></span>';
        if (c.has_testimonial) {
          const websiteOrDefunct = c.status_label
            ? `<span class="defunct">${escape(c.status_label)}</span>`
            : c.domaine
              ? `<a class="website" href="https://${escape(c.domaine.replace(/^https?:\/\//,''))}" target="_blank" rel="noopener">${escape(c.domaine.replace(/^https?:\/\//,''))} ↗</a>`
              : '';
          tmCell = `<span class="row-tm">
            <span class="tm-line">"${escape(c.verbatim || '')}"</span>
            <div class="tm-full">
              <p class="testimonial-quote">"${escape(c.verbatim || '')}"</p>
              <div class="testimonial-author">
                <div class="name">${escape(c.contact_name || '')}</div>
                <div class="role">${escape(c.contact_role || '')}</div>
              </div>
              ${websiteOrDefunct ? `<div class="testimonial-footer">${websiteOrDefunct}</div>` : ''}
            </div>
          </span>`;
        }

        return `<li class="row${clickableCls}${activeCls}" data-slug="${c.slug}">
          <a href="#" class="name-link ${cls}" data-slug="${c.slug}">${escape(c.name)}</a>
          ${logoCell}
          ${tmCell}
        </li>`;
      }

      function renderList() {
        const list = filteredClients();
        namesHost.innerHTML = list.map(rowHTML).join('');
        const total = sorted.length;
        if (searchQuery) {
          resultsCount.textContent = `${list.length} / ${total}`;
        } else {
          resultsCount.textContent = `${total} clients`;
        }
      }

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        activeSlug = null;
        renderList();
      });

      namesHost.addEventListener('click', (e) => {
        // Let the website link in the open testimonial work as a real link
        if (e.target.closest('.tm-full a.website')) return;
        const li = e.target.closest('li.row.clickable');
        if (!li) return;
        e.preventDefault();
        const slug = li.dataset.slug;
        activeSlug = (activeSlug === slug) ? null : slug;
        renderList();
      });

      fetch('clients.json').then(r => r.json()).then(data => {
        clients = data;
        sorted = sortClients(data);
        renderList();
      }).catch(err => console.error('Failed to load clients:', err));
    })();
  </script>
</body>
</html>
