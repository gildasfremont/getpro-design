<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GetPro — Clients</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .clients {
    display: flex;
    flex-direction: column;
    padding-bottom: var(--gap-section);
  }
  .clients-head {
    margin-bottom: clamp(14px, 1.4vw, 20px);
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 1.4vw, 20px);
  }

  .clients-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: clamp(20px, 3vw, 50px);
  }

  /* Panel — list mode */
  .clients-panel {
    background: var(--white);
    padding: clamp(28px, 3.4vw, 50px) clamp(20px, 3vw, 50px);
    display: grid;
    grid-template-columns: minmax(180px, 0.8fr) auto minmax(0, 1.5fr) minmax(0, 1.5fr);
    gap: clamp(20px, 3vw, 50px);
    align-items: start;
  }

  .filters {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1vw, 14px);
    font-size: var(--fs-body);
    line-height: 1.4;
  }
  .checkbox {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .checkbox-mark {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--ink);
    flex: none;
    position: relative;
  }
  .checkbox input { display: none; }
  .checkbox input:checked + .checkbox-mark::after {
    content: "";
    position: absolute;
    inset: 3px;
    background: var(--ink);
  }
  .filter-divider {
    height: 1px;
    background: var(--line);
    margin: clamp(6px, 0.7vw, 10px) 0;
  }

  .alphabet {
    display: flex;
    flex-direction: column;
    font-size: clamp(12px, 1vw, 14px);
    line-height: 1.4;
    color: var(--ink);
    opacity: 0.6;
    user-select: none;
  }
  .alphabet a { color: inherit; text-decoration: none; }
  .alphabet a:hover { opacity: 1; }

  .clients-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 0.8vw, 12px);
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.25;
  }
  .clients-list a { color: inherit; }
  /* Clients with testimonial: clickable, underlined */
  .clients-list .has-tm {
    text-decoration: underline;
    text-underline-offset: 4px;
    cursor: pointer;
  }
  .clients-list .has-tm::after {
    content: " →";
  }
  /* Clients without testimonial: plain text, not clickable */
  .clients-list .plain {
    cursor: default;
    pointer-events: none;
  }

  .logos-preview {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 0.8vw, 12px);
    opacity: 0.35;
  }
  .logos-preview li {
    height: clamp(22px, 2.5vw, 35px);
    display: flex;
    align-items: center;
  }
  .logos-preview img {
    max-height: 100%;
    max-width: 140px;
    object-fit: contain;
    object-position: left center;
  }

  /* Detail mode (testimonial view) */
  .detail-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    padding: clamp(14px, 1.4vw, 20px) 0;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: var(--fs-body);
    line-height: 1.3;
    text-decoration: underline;
    text-underline-offset: 4px;
    cursor: pointer;
    background: none;
    border: none;
    color: inherit;
    font-family: inherit;
    padding: 0;
  }
  .active-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: var(--fs-menu);
    line-height: 1.2;
    opacity: 0.7;
  }
  .active-filters .label { opacity: 0.5; margin-right: 4px; }
  .active-filters .chip {
    padding: 4px 10px;
    border: 1px solid var(--line);
  }

  .detail-panel {
    background: var(--white);
    padding: clamp(40px, 5vw, 80px) clamp(24px, 4vw, 70px);
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
    gap: clamp(40px, 5vw, 80px);
    align-items: start;
  }

  .detail-header {
    display: flex;
    align-items: baseline;
    gap: 20px;
    margin-bottom: clamp(28px, 3.4vw, 50px);
  }
  .detail-header h2 {
    font-size: var(--fs-card-title);
    line-height: var(--lh-card-title);
  }
  .detail-header .logo-mark {
    flex: none;
    height: clamp(28px, 3vw, 40px);
    width: auto;
  }

  .testimonial-detail {
    display: flex;
    flex-direction: column;
    gap: clamp(20px, 2.7vw, 40px);
  }
  .testimonial-quote {
    font-size: var(--fs-card-sub);
    line-height: var(--lh-card-sub);
  }
  .testimonial-author .name { font-size: var(--fs-body); line-height: 1.3; }
  .testimonial-author .role { font-size: var(--fs-body); line-height: 1.3; opacity: 0.8; }
  .case-description {
    font-size: var(--fs-body);
    line-height: var(--lh-body);
    opacity: 0.85;
  }

  .download-block {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 1.4vw, 20px);
    align-items: flex-start;
  }
  .download-preview {
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--line);
    background: var(--white);
  }
  .download-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: var(--fs-body);
    line-height: 1.3;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* Hide rules toggled via .mode-* on .clients */
  .clients.mode-list .detail-view { display: none; }
  .clients.mode-detail .clients-panel { display: none; }
  .clients.mode-detail .detail-view { display: flex; flex-direction: column; gap: clamp(20px, 2.5vw, 40px); }

  @media (max-width: 1100px) {
    .clients-panel { grid-template-columns: minmax(180px, 0.8fr) auto minmax(0, 1fr); }
    .logos-preview { display: none; }
  }
  @media (max-width: 800px) {
    .clients-title-row { flex-direction: column; align-items: flex-start; }
    .ratings-row { flex-wrap: wrap; }
    .clients-panel { grid-template-columns: 1fr; }
    .alphabet { flex-direction: row; flex-wrap: wrap; gap: 4px; }
    .detail-panel { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <main class="home">

    <header class="header section" data-nav></header>

    <section class="clients section mode-list">
      <div class="clients-head">
        <div class="clients-title-row">
          <h1 class="page-title">Clients</h1>
          <div class="ratings-row">
            <div class="rating">
              <img src="assets/trustpilot.svg" alt="Trustpilot" class="rating-logo" />
              <span class="rating-stars">5 ★★★★★</span>
            </div>
            <div class="rating">
              <img src="assets/trustfolio.svg" alt="Trustfolio" class="rating-logo" />
              <span class="rating-stars">4,8 ★★★★★</span>
            </div>
            <div class="rating">
              <img src="assets/google.svg" alt="Google" class="rating-logo" />
              <span class="rating-stars">4,3 ★★★★★</span>
            </div>
          </div>
        </div>
      </div>

      <!-- LIST MODE -->
      <div class="clients-panel">
        <div class="filters" id="filters">
          <label class="checkbox">
            <input type="checkbox" data-filter="all" checked />
            <span class="checkbox-mark"></span>
            <span>Tout</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" data-filter="testimonial" />
            <span class="checkbox-mark"></span>
            <span>Avec retour d'expérience (69)</span>
          </label>
          <div class="filter-divider" aria-hidden="true"></div>
          <label class="checkbox">
            <input type="checkbox" data-filter="finance" />
            <span class="checkbox-mark"></span>
            <span>Finance &amp; Assurance (50)</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" data-filter="sante" />
            <span class="checkbox-mark"></span>
            <span>Santé (26)</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" data-filter="beaute" />
            <span class="checkbox-mark"></span>
            <span>Beauté (8)</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" data-filter="education" />
            <span class="checkbox-mark"></span>
            <span>Éducation (8)</span>
          </label>
        </div>

        <nav class="alphabet" aria-label="Filtre alphabétique">
          <a href="#A">A</a><a href="#B">B</a><a href="#C">C</a><a href="#D">D</a>
          <a href="#E">E</a><a href="#F">F</a><a href="#G">G</a><a href="#H">H</a>
          <a href="#I">I</a><a href="#J">J</a><a href="#K">K</a><a href="#L">L</a>
          <a href="#M">M</a><a href="#N">N</a><a href="#O">O</a><a href="#P">P</a>
          <a href="#Q">Q</a><a href="#R">R</a><a href="#S">S</a><a href="#T">T</a>
          <a href="#U">U</a><a href="#V">V</a><a href="#W">W</a><a href="#X">X</a>
          <a href="#Y">Y</a><a href="#Z">Z</a>
        </nav>

        <ul class="clients-list" id="clients-names" role="list"></ul>

        <ul class="logos-preview" id="clients-logos" role="list" aria-hidden="true"></ul>
      </div>

      <!-- DETAIL MODE -->
      <div class="detail-view">
        <div class="detail-bar">
          <button type="button" class="back-link" id="back-btn">← Retour aux références</button>
          <div class="active-filters" id="active-filters"></div>
        </div>
        <div class="detail-panel">
          <div class="testimonial-detail" id="testimonial-detail"></div>
          <div class="download-block">
            <div class="download-preview" aria-hidden="true"></div>
            <a href="#" class="download-link">Télécharger le use case <span aria-hidden="true">⇣</span></a>
          </div>
        </div>
      </div>
    </section>

    <footer class="site-footer" data-footer></footer>

  </main>
  <script src="partials.js" defer></script>
  <script>
    (function() {
      const root = document.querySelector('.clients');
      const filtersHost = document.getElementById('filters');
      const namesHost = document.getElementById('clients-names');
      const logosHost = document.getElementById('clients-logos');
      const detailHost = document.getElementById('testimonial-detail');
      const activeFiltersHost = document.getElementById('active-filters');
      const backBtn = document.getElementById('back-btn');
      const escape = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

      let clients = [];
      let activeFilters = new Set();   // filter ids
      let activeSlug = null;            // detail mode

      // Heuristic sector matching from entity name (lightweight, no real categorization)
      // For prod, we'd use real entity.categorie_macro mapping. For now, just demo.
      function matchesFilter(client, fid) {
        if (fid === 'all' || fid === 'testimonial') return false; // handled separately
        // For sector filters, we don't have real sector data per client in clients.json,
        // so these checkboxes are decorative for now.
        return true;
      }

      function filteredClients() {
        // 'testimonial' filter: only those with has_testimonial
        if (activeFilters.has('testimonial')) {
          return clients.filter(c => c.has_testimonial);
        }
        return clients;
      }

      function renderList() {
        const list = filteredClients();
        namesHost.innerHTML = list.map(c => {
          const cls = c.has_testimonial ? 'has-tm' : 'plain';
          return `<li><a href="#" data-slug="${c.slug}" class="${cls}">${escape(c.name)}</a></li>`;
        }).join('');

        // Match logos with name list
        logosHost.innerHTML = list.map(c => {
          if (c.has_logo) {
            return `<li><img src="assets/${c.slug}.svg" alt="${escape(c.name)}" loading="lazy" /></li>`;
          }
          return `<li class="no-logo"><span>${escape(c.name)}</span></li>`;
        }).join('');
      }

      function renderActiveFilters() {
        const labels = {
          testimonial: 'Avec retour d’expérience',
          finance: 'Finance & Assurance',
          sante: 'Santé',
          beaute: 'Beauté',
          education: 'Éducation',
        };
        const active = [...activeFilters].filter(f => labels[f]);
        if (active.length === 0) {
          activeFiltersHost.innerHTML = '';
          return;
        }
        activeFiltersHost.innerHTML = `<span class="label">Filtres actifs :</span>`
          + active.map(f => `<span class="chip">${labels[f]}</span>`).join('');
      }

      function renderDetail() {
        const c = clients.find(x => x.slug === activeSlug);
        if (!c) return;
        const logoTag = c.has_logo
          ? `<img src="assets/${c.slug}.svg" alt="${escape(c.name)}" class="logo-mark" />`
          : '';
        detailHost.innerHTML = `
          <div class="detail-header">
            <h2>${escape(c.name)}</h2>
            ${logoTag}
          </div>
          <p class="testimonial-quote">“${escape(c.verbatim || 'Témoignage à venir.')}”</p>
          <div class="testimonial-author">
            <div class="name">${escape(c.contact_name || '')}</div>
            <div class="role">${escape(c.contact_role || '')}</div>
          </div>
          ${c.description ? `<p class="case-description">${escape(c.description)}</p>` : ''}
        `;
      }

      function setMode(mode) {
        root.classList.toggle('mode-list', mode === 'list');
        root.classList.toggle('mode-detail', mode === 'detail');
        if (mode === 'detail') {
          renderActiveFilters();
          renderDetail();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      // Filter checkboxes
      filtersHost.addEventListener('change', (e) => {
        const input = e.target.closest('input[data-filter]');
        if (!input) return;
        const fid = input.dataset.filter;
        if (fid === 'all') {
          // Toggling Tout = clear others
          if (input.checked) {
            activeFilters.clear();
            filtersHost.querySelectorAll('input[data-filter]').forEach(i => {
              if (i.dataset.filter !== 'all') i.checked = false;
            });
          }
        } else {
          if (input.checked) activeFilters.add(fid);
          else activeFilters.delete(fid);
          // Uncheck "Tout" if any other is checked
          const allInput = filtersHost.querySelector('input[data-filter="all"]');
          allInput.checked = activeFilters.size === 0;
        }
        renderList();
      });

      // Click on a clickable client name → detail
      namesHost.addEventListener('click', (e) => {
        const a = e.target.closest('a.has-tm[data-slug]');
        if (!a) return;
        e.preventDefault();
        activeSlug = a.dataset.slug;
        setMode('detail');
      });

      // Back button
      backBtn.addEventListener('click', () => {
        activeSlug = null;
        setMode('list');
      });

      fetch('clients.json').then(r => r.json()).then(data => {
        clients = data;
        renderList();
        setMode('list');
      }).catch(err => console.error('Failed to load clients:', err));
    })();
  </script>
</body>
</html>
