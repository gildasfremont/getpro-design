<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GetPro — Clients</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .clients {
    display: flex;
    flex-direction: column;
    padding-bottom: var(--gap-section);
  }
  .clients-head {
    margin-bottom: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 1.4vw, 20px);
  }
  .clients-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: clamp(20px, 3vw, 50px);
  }

  /* Filter tabs above the panel (flush, no hairline, no gap) */
  .clients-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(20px, 3vw, 50px);
  }
  .clients-tabs .tab {
    padding: 14px 0;
    font-size: var(--fs-body);
    line-height: 1.25;
    cursor: pointer;
    background: none;
    border: none;
    color: inherit;
    font-family: inherit;
    position: relative;
    white-space: nowrap;
  }
  .clients-tabs .tab[aria-current="true"]::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 2px;
    background: var(--ink);
  }

  /* Panel : just a card holding the list */
  .clients-panel {
    background: var(--white);
    padding: clamp(28px, 3.4vw, 50px) clamp(20px, 3vw, 50px);
  }

  /* The content grid : 3 cells per row → name | logo | testimonial */
  .clients-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(80px, 9vw, 130px) minmax(0, 3fr);
    column-gap: clamp(20px, 3vw, 50px);
    row-gap: clamp(8px, 0.8vw, 12px);
    align-items: baseline;
    /* Une seule taille de typo pour toute la zone : nom, preview, témoignage */
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.25;
  }
  .row { display: contents; }

  /* Col 1 : name (titre tronqué, pas de retour ligne) */
  .clients-list a.name-link {
    display: block;
    color: inherit;
    pointer-events: none;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .clients-list a.has-tm {
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .row.active a.has-tm { text-decoration-thickness: 2px; }

  /* Col 2 : logo */
  .logo-cell {
    display: block;
    align-self: center;
    min-height: clamp(20px, 2vw, 28px);
  }
  .row-logo {
    display: block;
    height: clamp(20px, 2vw, 28px);
    width: auto;
    max-width: clamp(80px, 9vw, 130px);
    object-fit: contain;
    object-position: left center;
  }

  /* Whole row is clickable when there is a testimonial */
  .row.clickable a.name-link,
  .row.clickable .logo-cell,
  .row.clickable .row-tm { cursor: pointer; }

  /* Col 3 : preview + (absolute) full testimonial */
  .row-tm {
    display: block;
    position: relative;
    min-width: 0;
  }
  .tm-line {
    display: block;
    opacity: 0.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tm-full {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    background: var(--white);
    padding-bottom: clamp(20px, 2.5vw, 40px);
    flex-direction: column;
    gap: clamp(18px, 2vw, 30px);
  }
  .row.active .tm-full { display: flex; }
  .row.active .tm-line { visibility: hidden; }

  .testimonial-quote { line-height: 1.3; }
  .testimonial-author .name { line-height: 1.3; }
  .testimonial-author .role { line-height: 1.3; opacity: 0.7; }

  /* Footer of the testimonial : just the website (or defunct status) */
  .testimonial-footer {
    display: flex;
    align-items: center;
    gap: clamp(20px, 3vw, 40px);
    flex-wrap: wrap;
  }
  .testimonial-footer .website {
    line-height: 1.3;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .testimonial-footer .defunct {
    line-height: 1.3;
    opacity: 0.6;
    font-style: italic;
  }

  @media (max-width: 800px) {
    .clients-title-row { flex-direction: column; align-items: flex-start; }
    .ratings-row { flex-wrap: wrap; }
    .clients-list {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      row-gap: clamp(8px, 0.8vw, 12px);
    }
    .logo-cell { display: none; }
    .tm-full {
      position: relative;
      padding-top: clamp(16px, 2vw, 24px);
      border-top: 1px solid var(--line);
    }
  }
</style>
</head>
<body>
  <main class="home">

    <header class="header section" data-nav></header>

    <section class="clients section">
      <div class="clients-head">
        <div class="clients-title-row">
          <h1 class="page-title">Clients</h1>
          <div class="ratings-row">
            <div class="rating">
              <img src="assets/trustpilot.svg" alt="Trustpilot" class="rating-logo" />
              <span class="rating-stars">5 ★★★★★</span>
            </div>
            <div class="rating">
              <img src="assets/trustfolio.svg" alt="Trustfolio" class="rating-logo" />
              <span class="rating-stars">4,8 ★★★★★</span>
            </div>
            <div class="rating">
              <img src="assets/google.svg" alt="Google" class="rating-logo" />
              <span class="rating-stars">4,3 ★★★★★</span>
            </div>
          </div>
        </div>
        <div class="clients-tabs" role="tablist" id="filters">
          <button class="tab" role="tab" data-filter="all" aria-current="true">Tout (381)</button>
          <button class="tab" role="tab" data-filter="testimonial">Avec retour d'expérience (69)</button>
          <button class="tab" role="tab" data-filter="finance">Finance &amp; Assurance (50)</button>
          <button class="tab" role="tab" data-filter="sante">Santé (26)</button>
          <button class="tab" role="tab" data-filter="beaute">Beauté (8)</button>
          <button class="tab" role="tab" data-filter="education">Éducation (8)</button>
        </div>
      </div>

      <div class="clients-panel">
        <ul class="clients-list" id="clients-names" role="list"></ul>
      </div>
    </section>

    <footer class="site-footer" data-footer></footer>

  </main>
  <script src="partials.js" defer></script>
  <script>
    (function() {
      const filtersHost = document.getElementById('filters');
      const namesHost = document.getElementById('clients-names');
      const escape = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

      let clients = [];
      let activeFilter = 'all';
      let activeSlug = null;

      function filteredClients() {
        if (activeFilter === 'testimonial') {
          return clients.filter(c => c.has_testimonial);
        }
        return clients;
      }

      function rowHTML(c) {
        const cls = c.has_testimonial ? 'has-tm' : 'plain';
        const clickableCls = c.has_testimonial ? ' clickable' : '';
        const activeCls = c.slug === activeSlug ? ' active' : '';
        const logoCell = c.has_logo
          ? `<span class="logo-cell"><img class="row-logo" src="assets/${c.slug}.svg" alt="" loading="lazy" /></span>`
          : '<span class="logo-cell"></span>';

        let tmCell = '<span class="row-tm"></span>';
        if (c.has_testimonial) {
          const websiteOrDefunct = c.status_label
            ? `<span class="defunct">${escape(c.status_label)}</span>`
            : c.domaine
              ? `<a class="website" href="https://${escape(c.domaine.replace(/^https?:\/\//,''))}" target="_blank" rel="noopener">${escape(c.domaine.replace(/^https?:\/\//,''))} ↗</a>`
              : '';
          tmCell = `<span class="row-tm">
            <span class="tm-line">"${escape(c.verbatim || '')}"</span>
            <div class="tm-full">
              <p class="testimonial-quote">"${escape(c.verbatim || '')}"</p>
              <div class="testimonial-author">
                <div class="name">${escape(c.contact_name || '')}</div>
                <div class="role">${escape(c.contact_role || '')}</div>
              </div>
              ${websiteOrDefunct ? `<div class="testimonial-footer">${websiteOrDefunct}</div>` : ''}
            </div>
          </span>`;
        }

        return `<li class="row${clickableCls}${activeCls}" data-slug="${c.slug}">
          <a href="#" class="name-link ${cls}" data-slug="${c.slug}">${escape(c.name)}</a>
          ${logoCell}
          ${tmCell}
        </li>`;
      }

      function renderList() {
        const list = filteredClients();
        namesHost.innerHTML = list.map(rowHTML).join('');
      }

      filtersHost.addEventListener('click', (e) => {
        const btn = e.target.closest('button.tab[data-filter]');
        if (!btn) return;
        e.preventDefault();
        activeFilter = btn.dataset.filter;
        filtersHost.querySelectorAll('button.tab').forEach(b => {
          if (b === btn) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
        activeSlug = null;
        renderList();
      });

      namesHost.addEventListener('click', (e) => {
        // Let the website link in the open testimonial work as a real link
        if (e.target.closest('.tm-full a.website')) return;
        const li = e.target.closest('li.row.clickable');
        if (!li) return;
        e.preventDefault();
        const slug = li.dataset.slug;
        activeSlug = (activeSlug === slug) ? null : slug;
        renderList();
      });

      fetch('clients.json').then(r => r.json()).then(data => {
        clients = data;
        renderList();
      }).catch(err => console.error('Failed to load clients:', err));
    })();
  </script>
</body>
</html>
