<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GetPro — Clients</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .clients {
    display: flex;
    flex-direction: column;
    padding-bottom: var(--gap-section);
  }
  .clients-head {
    margin-bottom: clamp(14px, 1.4vw, 20px);
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 1.4vw, 20px);
  }
  .clients-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: clamp(20px, 3vw, 50px);
  }

  .clients-panel {
    background: var(--white);
    padding: clamp(28px, 3.4vw, 50px) clamp(20px, 3vw, 50px);
    display: grid;
    grid-template-columns: minmax(200px, 0.8fr) auto minmax(0, 3fr);
    gap: clamp(20px, 3vw, 50px);
    align-items: start;
  }

  /* Filters */
  .filters {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1vw, 14px);
    font-size: var(--fs-body);
    line-height: 1.4;
  }
  .checkbox {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .checkbox-mark {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--ink);
    flex: none;
    position: relative;
  }
  .checkbox input { display: none; }
  .checkbox input:checked + .checkbox-mark::after {
    content: "";
    position: absolute;
    inset: 3px;
    background: var(--ink);
  }
  .filter-divider {
    height: 1px;
    background: var(--line);
    margin: clamp(6px, 0.7vw, 10px) 0;
  }

  /* Alphabet */
  .alphabet {
    display: flex;
    flex-direction: column;
    font-size: clamp(12px, 1vw, 14px);
    line-height: 1.4;
    color: var(--ink);
    opacity: 0.6;
    user-select: none;
  }
  .alphabet a { color: inherit; text-decoration: none; }
  .alphabet a:hover { opacity: 1; }

  /* Names list — accordion */
  .clients-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 0.8vw, 12px);
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.25;
  }
  .client-row {
    display: grid;
    grid-template-columns: 1fr;
  }
  .client-row .row-line {
    display: flex;
    align-items: center;
    gap: clamp(12px, 1.4vw, 20px);
  }
  .client-row a.name { color: inherit; }
  .client-row .has-tm {
    text-decoration: underline;
    text-underline-offset: 4px;
    cursor: pointer;
  }
  .client-row .has-tm::after { content: " →"; }
  .client-row.expanded .has-tm::after { content: " ↓"; }
  .client-row .plain { cursor: default; pointer-events: none; }

  .row-logo {
    height: clamp(20px, 2vw, 28px);
    width: auto;
    max-width: clamp(80px, 9vw, 130px);
    object-fit: contain;
    object-position: left center;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .client-row:hover .row-logo { opacity: 1; }
  .client-row.expanded .row-logo { opacity: 1; }

  /* Inline testimonial (collapsed by default) */
  .testimonial-inline {
    display: none;
    margin-top: clamp(20px, 2.5vw, 36px);
    margin-bottom: clamp(20px, 2.5vw, 36px);
    padding-top: clamp(20px, 2.2vw, 30px);
    padding-bottom: clamp(20px, 2.2vw, 30px);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    flex-direction: column;
    gap: clamp(20px, 2.5vw, 36px);
  }
  .client-row.expanded .testimonial-inline {
    display: flex;
  }

  .testimonial-quote {
    font-size: var(--fs-card-sub);
    line-height: var(--lh-card-sub);
    max-width: 50ch;
  }

  .testimonial-author .name {
    font-size: var(--fs-body);
    line-height: 1.3;
  }
  .testimonial-author .role {
    font-size: var(--fs-body);
    line-height: 1.3;
    opacity: 0.8;
  }

  .case-description {
    font-size: var(--fs-body);
    line-height: var(--lh-body);
    max-width: 60ch;
    opacity: 0.85;
  }

  /* Footer of the testimonial : logo + website */
  .testimonial-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(20px, 3vw, 50px);
    flex-wrap: wrap;
  }
  .testimonial-footer .footer-logo {
    height: clamp(28px, 3vw, 44px);
    width: auto;
    max-width: clamp(120px, 14vw, 200px);
    object-fit: contain;
    object-position: left center;
  }
  .testimonial-footer .website {
    font-size: var(--fs-body);
    line-height: 1.3;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .testimonial-footer .defunct {
    font-size: var(--fs-body);
    line-height: 1.3;
    opacity: 0.6;
    font-style: italic;
  }

  @media (max-width: 800px) {
    .clients-title-row { flex-direction: column; align-items: flex-start; }
    .ratings-row { flex-wrap: wrap; }
    .clients-panel { grid-template-columns: 1fr; }
    .alphabet { flex-direction: row; flex-wrap: wrap; gap: 4px; }
    .row-logo { display: none; }
  }
</style>
</head>
<body>
  <main class="home">

    <header class="header section" data-nav></header>

    <section class="clients section">
      <div class="clients-head">
        <div class="clients-title-row">
          <h1 class="page-title">Clients</h1>
          <div class="ratings-row">
            <div class="rating">
              <img src="assets/trustpilot.svg" alt="Trustpilot" class="rating-logo" />
              <span class="rating-stars">5 ★★★★★</span>
            </div>
            <div class="rating">
              <img src="assets/trustfolio.svg" alt="Trustfolio" class="rating-logo" />
              <span class="rating-stars">4,8 ★★★★★</span>
            </div>
            <div class="rating">
              <img src="assets/google.svg" alt="Google" class="rating-logo" />
              <span class="rating-stars">4,3 ★★★★★</span>
            </div>
          </div>
        </div>
      </div>

      <div class="clients-panel">
        <div class="filters" id="filters">
          <label class="checkbox">
            <input type="checkbox" data-filter="all" checked />
            <span class="checkbox-mark"></span>
            <span>Tout</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" data-filter="testimonial" />
            <span class="checkbox-mark"></span>
            <span>Avec retour d'expérience (69)</span>
          </label>
          <div class="filter-divider" aria-hidden="true"></div>
          <label class="checkbox">
            <input type="checkbox" data-filter="finance" />
            <span class="checkbox-mark"></span>
            <span>Finance &amp; Assurance (50)</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" data-filter="sante" />
            <span class="checkbox-mark"></span>
            <span>Santé (26)</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" data-filter="beaute" />
            <span class="checkbox-mark"></span>
            <span>Beauté (8)</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" data-filter="education" />
            <span class="checkbox-mark"></span>
            <span>Éducation (8)</span>
          </label>
        </div>

        <nav class="alphabet" aria-label="Filtre alphabétique">
          <a href="#A">A</a><a href="#B">B</a><a href="#C">C</a><a href="#D">D</a>
          <a href="#E">E</a><a href="#F">F</a><a href="#G">G</a><a href="#H">H</a>
          <a href="#I">I</a><a href="#J">J</a><a href="#K">K</a><a href="#L">L</a>
          <a href="#M">M</a><a href="#N">N</a><a href="#O">O</a><a href="#P">P</a>
          <a href="#Q">Q</a><a href="#R">R</a><a href="#S">S</a><a href="#T">T</a>
          <a href="#U">U</a><a href="#V">V</a><a href="#W">W</a><a href="#X">X</a>
          <a href="#Y">Y</a><a href="#Z">Z</a>
        </nav>

        <ul class="clients-list" id="clients-names" role="list"></ul>
      </div>
    </section>

    <footer class="site-footer" data-footer></footer>

  </main>
  <script src="partials.js" defer></script>
  <script>
    (function() {
      const filtersHost = document.getElementById('filters');
      const namesHost = document.getElementById('clients-names');
      const escape = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

      let clients = [];
      let activeFilters = new Set();
      let expandedSlug = null;

      function filteredClients() {
        if (activeFilters.has('testimonial')) {
          return clients.filter(c => c.has_testimonial);
        }
        return clients;
      }

      function rowHTML(c) {
        const isExpanded = c.slug === expandedSlug;
        const cls = c.has_testimonial ? 'has-tm' : 'plain';
        const logoTag = c.has_logo
          ? `<img class="row-logo" src="assets/${c.slug}.svg" alt="" loading="lazy" />`
          : `<span></span>`;
        let tmHTML = '';
        if (c.has_testimonial) {
          const websiteOrDefunct = c.status_label
            ? `<span class="defunct">${escape(c.status_label)}</span>`
            : c.domaine
              ? `<a class="website" href="https://${escape(c.domaine.replace(/^https?:\/\//,''))}" target="_blank" rel="noopener">${escape(c.domaine.replace(/^https?:\/\//,''))} ↗</a>`
              : '';
          const footerLogo = c.has_logo
            ? `<img class="footer-logo" src="assets/${c.slug}.svg" alt="${escape(c.name)}" />`
            : `<span class="footer-logo" style="opacity:0.6;font-size:var(--fs-body);">${escape(c.name)}</span>`;
          tmHTML = `
            <div class="testimonial-inline">
              <p class="testimonial-quote">"${escape(c.verbatim || '')}"</p>
              <div class="testimonial-author">
                <div class="name">${escape(c.contact_name || '')}</div>
                <div class="role">${escape(c.contact_role || '')}</div>
              </div>
              ${c.description ? `<p class="case-description">${escape(c.description)}</p>` : ''}
              <div class="testimonial-footer">
                ${footerLogo}
                ${websiteOrDefunct}
              </div>
            </div>`;
        }
        return `<li class="client-row${isExpanded ? ' expanded' : ''}">
          <div class="row-line">
            <a href="#" data-slug="${c.slug}" class="name ${cls}">${escape(c.name)}</a>
            ${logoTag}
          </div>
          ${tmHTML}
        </li>`;
      }

      function renderList() {
        const list = filteredClients();
        namesHost.innerHTML = list.map(rowHTML).join('');
      }

      filtersHost.addEventListener('change', (e) => {
        const input = e.target.closest('input[data-filter]');
        if (!input) return;
        const fid = input.dataset.filter;
        if (fid === 'all') {
          if (input.checked) {
            activeFilters.clear();
            filtersHost.querySelectorAll('input[data-filter]').forEach(i => {
              if (i.dataset.filter !== 'all') i.checked = false;
            });
          }
        } else {
          if (input.checked) activeFilters.add(fid);
          else activeFilters.delete(fid);
          const allInput = filtersHost.querySelector('input[data-filter="all"]');
          allInput.checked = activeFilters.size === 0;
        }
        // Closing any expansion when filter changes
        expandedSlug = null;
        renderList();
      });

      namesHost.addEventListener('click', (e) => {
        const a = e.target.closest('a.has-tm[data-slug]');
        if (!a) return;
        e.preventDefault();
        const slug = a.dataset.slug;
        expandedSlug = (expandedSlug === slug) ? null : slug;
        renderList();
      });

      fetch('clients.json').then(r => r.json()).then(data => {
        clients = data;
        renderList();
      }).catch(err => console.error('Failed to load clients:', err));
    })();
  </script>
</body>
</html>
