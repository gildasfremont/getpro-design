<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GetPro — Clients</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .clients {
    display: flex;
    flex-direction: column;
    padding-bottom: var(--gap-section);
  }
  .clients-head {
    margin-bottom: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 1.4vw, 20px);
  }
  .clients-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: clamp(20px, 3vw, 50px);
  }

  /* Search bar above the panel (flush) */
  .clients-search {
    display: flex;
    align-items: center;
    gap: clamp(12px, 1.4vw, 20px);
    padding: 14px 0;
  }
  .clients-search input {
    flex: 1 1 0;
    min-width: 0;
    background: none;
    border: none;
    outline: none;
    color: inherit;
    font-family: inherit;
    font-size: var(--fs-body);
    line-height: 1.25;
    padding: 0;
  }
  .clients-search input::placeholder {
    color: var(--ink);
    opacity: 0.4;
  }

  /* Panel : just a card holding the list */
  .clients-panel {
    background: var(--white);
    padding: clamp(28px, 3.4vw, 50px) clamp(20px, 3vw, 50px);
  }

  /* The content grid : parent grid defines the 3 column tracks, each <li.row>
     is a real subgrid item that inherits those tracks. No display:contents. */
  .clients-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(80px, 9vw, 130px) minmax(0, 3fr);
    column-gap: clamp(20px, 3vw, 50px);
    row-gap: clamp(8px, 0.8vw, 12px);
    /* Une seule taille de typo pour toute la zone : nom, preview, témoignage */
    font-size: clamp(18px, 2vw, 28px);
    line-height: 1.25;
  }
  .row {
    display: grid;
    grid-template-columns: subgrid;
    grid-column: 1 / -1;
    align-items: baseline;
    position: relative;
    transition: opacity 0.18s ease;
  }
  .row.clickable { cursor: pointer; }

  /* When a row is active (testimonial open), grey out all the other rows.
     Any row being hovered (or the active one itself) returns to full opacity. */
  .clients-list:has(.row.active) .row { opacity: 0.3; }
  .clients-list:has(.row.active) .row.active,
  .clients-list:has(.row.active) .row:hover { opacity: 1; }

  /* Col 1 : name (titre tronqué, pas de retour ligne) */
  .clients-list a.name-link {
    display: block;
    color: inherit;
    pointer-events: none;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .clients-list a.has-tm {
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .row.active a.has-tm { text-decoration-thickness: 2px; }

  /* Col 2 : logo */
  .logo-cell {
    display: block;
    align-self: center;
    min-height: clamp(20px, 2vw, 28px);
  }
  .row-logo {
    display: block;
    height: clamp(20px, 2vw, 28px);
    width: auto;
    max-width: clamp(80px, 9vw, 130px);
    object-fit: contain;
    object-position: left center;
  }

  /* Col 3 : preview + (absolute) full testimonial */
  .row-tm {
    display: block;
    position: relative;
    min-width: 0;
  }
  .tm-line {
    display: block;
    opacity: 0.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tm-full {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    background: var(--white);
    padding-bottom: clamp(20px, 2.5vw, 40px);
    flex-direction: column;
    gap: clamp(18px, 2vw, 30px);
  }
  .row.active .tm-full { display: flex; }
  .row.active .tm-line { display: none; }

  .testimonial-quote { line-height: 1.3; }
  .testimonial-author .name { line-height: 1.3; }
  .testimonial-author .role { line-height: 1.3; opacity: 0.7; }

  /* Footer of the testimonial : just the website (or defunct status) */
  .testimonial-footer {
    display: flex;
    align-items: center;
    gap: clamp(20px, 3vw, 40px);
    flex-wrap: wrap;
  }
  .testimonial-footer .website {
    line-height: 1.3;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .testimonial-footer .defunct {
    line-height: 1.3;
    opacity: 0.6;
    font-style: italic;
  }

  @media (max-width: 800px) {
    .clients-title-row { flex-direction: column; align-items: flex-start; }
    .ratings-row { flex-wrap: wrap; }
    .clients-list {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      row-gap: clamp(8px, 0.8vw, 12px);
    }
    .row { grid-column: 1 / -1; }
    .logo-cell { display: none; }
    .tm-full {
      position: relative;
    }
  }
</style>
</head>
<body>
  <main class="home">

    <header class="header section" data-nav></header>

    <section class="clients section">
      <div class="clients-head">
        <div class="clients-title-row">
          <h1 class="page-title">Clients</h1>
          <div class="ratings-row">
            <div class="rating">
              <img src="assets/trustpilot.svg" alt="Trustpilot" class="rating-logo" />
              <span class="rating-stars">5 ★★★★★</span>
            </div>
            <div class="rating">
              <img src="assets/trustfolio.svg" alt="Trustfolio" class="rating-logo" />
              <span class="rating-stars">4,8 ★★★★★</span>
            </div>
            <div class="rating">
              <img src="assets/google.svg" alt="Google" class="rating-logo" />
              <span class="rating-stars">4,3 ★★★★★</span>
            </div>
          </div>
        </div>
        <div class="clients-search">
          <input type="search" id="clients-search" placeholder="Rechercher un client" autocomplete="off" />
        </div>
      </div>

      <div class="clients-panel">
        <ul class="clients-list" id="clients-names" role="list"></ul>
      </div>
    </section>

    <footer class="site-footer" data-footer></footer>

  </main>
  <script src="partials.js" defer></script>
  <script>
    (function() {
      const searchInput = document.getElementById('clients-search');
      const namesHost = document.getElementById('clients-names');
      const escape = (s) => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const norm = (s) => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

      // Cool order : the array order IS the display order — pas d'alpha entre eux.
      // Le reste des clients (non listés ici) tombe en queue, en ordre alpha.
      const COOL_ORDER = [
        // — IA hot
        'mistral-ai', 'eleven-labs', 'dust', 'filigran', 'kili-technology',
        'mindee', 'harfanglab', 'sipearl', 'unifai', 'autrice-ai',
        'webyn-ai', 'ai-cargo-foundation',
        // — Réseaux sociaux & marques avec présence média / consumer
        'yubo', 'voggt', 'voodoo', 'kisskissbankbank', 'joko',
        'cheerz', 'lunii', 'mwm', 'madbox', 'kabeen', 'ron-dorff',
        'lemlist', 'onefinestay', 'splio',
        // — Scale-ups B+ connues / grosses levées
        'electra', 'contentsquare', 'doctrine', 'evaneos', 'jobteaser',
        'pigment', 'lucca', 'partoo', 'getaround', 'matera', 'agicap',
        // — Grandes marques françaises
        'blablacar', 'carrefour', 'carrefour-2', 'decathlon', 'jcdecaux',
        'canal-plus', 'rakuten', 'rakuten-dx', 'total', 'porsche-france',
        'edf-enr', 'oscaro', 'prestashop',
        // — Tech identifiable B2B
        'flaire', 'manomano', 'libeo', 'leetchi', 'kard', 'foodles',
        'spiko', 'cybelangel', 'twicpics', 'jus-mundi', 'mytraffic',
      ];
      const RANK = new Map(COOL_ORDER.map((slug, i) => [slug, i]));
      const rankOf = (slug) => RANK.has(slug) ? RANK.get(slug) : Infinity;

      const sortClients = (list) => list.slice().sort((a, b) => {
        const ra = rankOf(a.slug);
        const rb = rankOf(b.slug);
        if (ra !== rb) return ra - rb;
        // Tie-break (only fires for the unranked rest) : alpha
        return a.name.localeCompare(b.name, 'fr', { sensitivity: 'base' });
      });

      let clients = [];
      let sorted = [];
      let searchQuery = '';
      let activeSlug = null;

      function filteredClients() {
        if (!searchQuery) return sorted;
        const q = norm(searchQuery);
        return sorted.filter(c => norm(c.name).includes(q));
      }

      function rowHTML(c) {
        const cls = c.has_testimonial ? 'has-tm' : 'plain';
        const clickableCls = c.has_testimonial ? ' clickable' : '';
        const activeCls = c.slug === activeSlug ? ' active' : '';
        const logoCell = c.has_logo
          ? `<span class="logo-cell"><img class="row-logo" src="assets/${c.slug}.svg" alt="" loading="lazy" /></span>`
          : '<span class="logo-cell"></span>';

        let tmCell = '<span class="row-tm"></span>';
        if (c.has_testimonial) {
          const websiteOrDefunct = c.status_label
            ? `<span class="defunct">${escape(c.status_label)}</span>`
            : c.domaine
              ? `<a class="website" href="https://${escape(c.domaine.replace(/^https?:\/\//,''))}" target="_blank" rel="noopener">${escape(c.domaine.replace(/^https?:\/\//,''))} ↗</a>`
              : '';
          tmCell = `<span class="row-tm">
            <span class="tm-line">"${escape(c.verbatim || '')}"</span>
            <div class="tm-full">
              <p class="testimonial-quote">"${escape(c.verbatim || '')}"</p>
              <div class="testimonial-author">
                <div class="name">${escape(c.contact_name || '')}</div>
                <div class="role">${escape(c.contact_role || '')}</div>
              </div>
              ${websiteOrDefunct ? `<div class="testimonial-footer">${websiteOrDefunct}</div>` : ''}
            </div>
          </span>`;
        }

        return `<li class="row${clickableCls}${activeCls}" data-slug="${c.slug}">
          <a href="#" class="name-link ${cls}" data-slug="${c.slug}">${escape(c.name)}</a>
          ${logoCell}
          ${tmCell}
        </li>`;
      }

      function renderList() {
        const list = filteredClients();
        namesHost.innerHTML = list.map(rowHTML).join('');
      }

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        activeSlug = null;
        renderList();
      });

      namesHost.addEventListener('click', (e) => {
        // Let the website link in the open testimonial work as a real link
        if (e.target.closest('.tm-full a.website')) return;
        const li = e.target.closest('li.row.clickable');
        if (!li) return;
        e.preventDefault();
        const slug = li.dataset.slug;
        activeSlug = (activeSlug === slug) ? null : slug;
        renderList();
      });

      fetch('clients.json', { cache: 'no-store' }).then(r => r.json()).then(data => {
        clients = data;
        sorted = sortClients(data);

        // Deep-link : open the testimonial of the slug in the URL hash (e.g. clients.html#mistral-ai)
        const hash = decodeURIComponent((location.hash || '').replace(/^#/, ''));
        if (hash) {
          const target = clients.find(c => c.slug === hash && c.has_testimonial);
          if (target) activeSlug = target.slug;
        }
        renderList();

        // Scroll the active row into a comfortable viewport position
        if (activeSlug) {
          const li = namesHost.querySelector(`li.row[data-slug="${activeSlug}"]`);
          if (li) {
            const targetY = li.getBoundingClientRect().top + window.scrollY - 80;
            window.scrollTo({ top: Math.max(0, targetY), behavior: 'auto' });
          }
        }
      }).catch(err => console.error('Failed to load clients:', err));
    })();
  </script>
</body>
</html>
